function tokenize(s){return s.toLowerCase().replace(/[^a-z0-9\s']/g,' ').split(/\s+/).filter(Boolean)}
function diffWords(said,target){
  const a=tokenize(said),b=tokenize(target);
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  // backtrack for annotation on target words
  let i=m,j=n;const targetMarks=new Array(n).fill(false);
  while(i>0&&j>0){
    if(a[i-1]===b[j-1]){targetMarks[j-1]=true;i--;j--}
    else if(dp[i-1][j-1]<=dp[i-1][j]&&dp[i-1][j-1]<=dp[i][j-1]){i--;j--}
    else if(dp[i-1][j]<=dp[i][j-1])i--;else j--;
  }
  const hit=targetMarks.filter(Boolean).length;
  const rawTarget=target.split(/\s+/);
  return{score:Math.round(hit/(n||1)*100),targetMarks,rawTarget};
}
function checkDictation(p){
  const val=document.getElementById('dt-input').value.trim();
  if(!val)return;
  const {score,targetMarks,rawTarget}=diffWords(val,p.en);
  const words=rawTarget.map((w,i)=>{
    const key=w.toLowerCase().replace(/[^a-z0-9']/g,'');
    if(!key)return w;
    return `<span class="${targetMarks[i]?'dt-w-hit':'dt-w-miss'}">${esc(w)}</span>`;
  }).join(' ');
  const col=score>=90?'var(--enchanted)':score>=70?'var(--gold)':'var(--ember)';
  const msg=score>=90?'完璧！':score>=70?'惜しい！赤い単語を意識して。':'もう一度Slowで聞いてみましょう。';
  document.getElementById('dt-result').innerHTML=`
    <div class="shadow-score" style="color:${col};margin-top:16px">${score}</div>
    <div class="shadow-msg">${msg}</div>
    <div class="sec-sub" style="margin-top:16px">お手本</div>
    <div class="dt-diff">${words}</div>
    <div class="sec-sub" style="margin-top:16px">あなたの入力</div>
    <div class="dt-diff" style="color:var(--text-secondary)">${esc(val)}</div>
    <button class="btn btn-secondary btn-block" style="margin-top:16px" onclick="startDictation('${p.id}')">もう一度 ${ICONS.arrowRight}</button>`;
  addXP('shadowing_attempt');
  if(score>=90){addXP('shadowing_high_score');sfx('correct');launchConfetti()}else if(score>=70)sfx('correct');else sfx('wrong');
  srsAnswer(p.id,score>=70);
  if(!PREF_REDUCED&&window.gsap)gsap.fromTo('#dt-result',{opacity:0,y:8},{opacity:1,y:0,duration:0.4});
}

/* ========== REVIEW DECK ========== */
let rvState=null;
function buildReviewDeck(){
  const t=todayStr();const seen=new Set();const deck=[];
  Object.keys(SCENARIOS).forEach(sid=>{
    SCENARIOS[sid].phrases.forEach(p=>{
      const rec=PROG.phrases[p.id];
      const due=rec&&rec.views>0&&rec.nextReview<=t;
      const bm=BM.includes(p.id);
      if((due||bm)&&!seen.has(p.id)){seen.add(p.id);deck.push({...p,_sid:sid,_scene:SCENARIOS[sid].title})}
    });
  });
  WDW_CATS.forEach(cat=>{
    (WDW_PHRASES[cat.id]||[]).forEach(p=>{
      const rec=PROG.phrases[p.id];
      const due=rec&&rec.views>0&&rec.nextReview<=t;
      const bm=BM.includes(p.id);
      if((due||bm)&&!seen.has(p.id)){seen.add(p.id);deck.push({...p,cat:cat.name,_sid:'wdw:'+cat.id,_scene:'WDW'})}
    });
  });
  return deck.sort(()=>Math.random()-0.5);
}
function openReview(){
  const deck=buildReviewDeck();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-review');el.classList.add('active');
  window.scrollTo(0,0);
  if(!deck.length){
    el.innerHTML=`<div class="back-row"><button class="icon-btn" onclick="go('home')" aria-label="戻る">${ICONS.arrowLeft}</button><h2>Review</h2></div>
      <div class="empty">${ICONS.check}<br><br>今日の復習はありません。<br>フレーズを学習・ブックマークすると、最適なタイミングでここに集まります。</div>`;
    return;
  }
  rvState={deck,i:0,got:0,flipped:false};
  renderReviewCard();
  anim(el,{opacity:0,y:12},{opacity:1,y:0,duration:0.35,ease:'power2.out'});
}
function renderReviewCard(){
  const el=document.getElementById('screen-review');
  const {deck,i}=rvState;
  if(i>=deck.length)return renderReviewDone();
  const p=deck[i];rvState.flipped=false;
  el.innerHTML=`
    <div class="rv-top">
      <button class="icon-btn" onclick="go('home')" aria-label="復習を終了">${ICONS.arrowLeft}</button>
      <div class="rv-prog"><div class="rv-prog-fill" style="width:${i/deck.length*100}%"></div></div>
      <span style="font-size:var(--text-xs);color:var(--text-muted);min-width:44px;text-align:right">${i+1}/${deck.length}</span>
    </div>
    <div class="rv-flip" id="rv-flip" role="button" tabindex="0" aria-label="カードをめくる">
      <div class="rv-inner">
        <div class="rv-face">
          <div class="rv-en">${esc(p.en)}</div>
          <div class="rv-scene">${esc(p._scene)} · ${esc(p.cat)}</div>
          <div class="rv-hint">タップで意味を確認</div>
        </div>
        <div class="rv-face rv-back">
          <div class="rv-ja">${esc(p.ja)}</div>
          <div class="rv-pron">${esc(p.pron)}</div>
          <button class="btn btn-secondary" id="rv-speak" aria-label="発音を再生">${ICONS.play} 発音</button>
        </div>
      </div>
    </div>
    <div class="rv-actions" id="rv-actions" style="visibility:hidden">
      <button class="btn btn-secondary" id="rv-again" aria-label="まだ覚えていない">もう一度</button>
      <button class="btn btn-gold" id="rv-got" aria-label="覚えた">覚えた ${ICONS.check}</button>
    </div>`;
  const flip=document.getElementById('rv-flip');
  const doFlip=()=>{
    if(rvState.flipped)return;
    rvState.flipped=true;flip.classList.add('flipped');
    document.getElementById('rv-actions').style.visibility='visible';
    recordPhraseView(p.id);renderHeader();
  };
  flip.onclick=e=>{if(e.target.closest('#rv-speak'))return;doFlip()};
  flip.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doFlip()}};
  document.getElementById('rv-speak').onclick=e=>{e.stopPropagation();speak(p.en)};
  document.getElementById('rv-again').onclick=()=>rvNext(false);
  document.getElementById('rv-got').onclick=()=>rvNext(true);
}
function rvNext(ok){
  const p=rvState.deck[rvState.i];
  srsAnswer(p.id,ok);
  if(ok){rvState.got++;if(BM.includes(p.id)){/* keep bookmark */}}
  rvState.i++;renderReviewCard();
}
function renderReviewDone(){
  const el=document.getElementById('screen-review');
  const {got,deck}=rvState;
  PROG.commuteSessions=(PROG.commuteSessions||0)+1;commit();checkClearBadges();
  if(got===deck.length&&deck.length>0)launchConfetti();
  const mood=got===deck.length?'win':(got>=deck.length*0.6?'hello':'cheer');
  el.innerHTML=`${sparkHeroHTML(mood)}
    <div class="card result-card">
    <div class="result-score">${got} / ${deck.length}</div>
    <div class="result-msg">復習セッション完了！覚えたフレーズは次回、より先の日付で再出題されます（間隔反復）。</div>
    <button class="btn btn-gold btn-block" onclick="go('home')">Home ${ICONS.arrowRight}</button>
  </div>`;
}

  window.scrollTo(0,0);
  if(!deck.length){
    el.innerHTML=`<div class="back-row"><button class="icon-btn" onclick="go('toeic')" aria-label="戻る">${ICONS.arrowLeft}</button><h2>単語帳</h2></div>
      <div class="empty">${ICONS.check}<br><br>ノートは空っぽです。<br>単語学習で「言えなかった」を選ぶと、ここに自動で集まります。</div>`;
    return;
  }
  wnoteState={deck,i:0,got:0,flipped:false};
  renderWordNotebookCard();
  anim(el,{opacity:0,y:12},{opacity:1,y:0,duration:0.35,ease:'power2.out'});
}
function renderWordNotebookCard(){
  const el=document.getElementById('screen-review');
  const {deck,i}=wnoteState;
  if(i>=deck.length)return renderWordNotebookDone();
  const v=deck[i];wnoteState.flipped=false;
  el.innerHTML=`
    <div class="rv-top">
      <button class="icon-btn" onclick="go('toeic')" aria-label="単語帳を終了">${ICONS.arrowLeft}</button>
      <div class="rv-prog"><div class="rv-prog-fill" style="width:${i/deck.length*100}%"></div></div>
      <span style="font-size:var(--text-xs);color:var(--text-muted);min-width:44px;text-align:right">${i+1}/${deck.length}</span>
    </div>
    <div class="wnote-wrap">
      <div class="wnote-peek p2"></div>
      <div class="wnote-peek p1"></div>
      <div class="rv-flip wnote-flip" id="wnote-flip" role="button" tabindex="0" aria-label="カードをめくる">
        <div class="rv-inner">
          <div class="rv-face">
            <div class="wnote-rings"><i></i><i></i><i></i></div>
            <div class="wnote-tag">Tier ${v.tier}</div>
            <div class="wnote-word">${esc(v.w)}</div>
            <div style="text-align:center;margin-top:4px"><span class="wnote-pos">${esc(v.pos)}</span></div>
            <div class="rv-hint">タップして意味を見る</div>
          </div>
          <div class="rv-face rv-back">
            <div class="wnote-rings"><i></i><i></i><i></i></div>
            <div class="vocab-ja">${esc(v.ja)}</div>
            <div class="vocab-ex">${esc(v.ex)}<div class="vocab-ex-ja">${esc(v.exja)}</div></div>
            <button class="btn btn-secondary" id="wnote-speak" style="margin-top:10px" aria-label="発音を再生">${ICONS.play} 発音</button>
          </div>
        </div>
      </div>
    </div>
    <div class="rv-actions" id="wnote-actions" style="visibility:hidden">
      <button class="btn btn-secondary" id="wnote-again" aria-label="まだ覚えていない">まだ苦手</button>
      <button class="btn btn-gold" id="wnote-got" aria-label="覚えた">覚えた！ ${ICONS.check}</button>
    </div>`;
  const flip=document.getElementById('wnote-flip');
  const doFlip=()=>{
    if(wnoteState.flipped)return;
    wnoteState.flipped=true;flip.classList.add('flipped');
    document.getElementById('wnote-actions').style.visibility='visible';
  };
  flip.onclick=e=>{if(e.target.closest('#wnote-speak'))return;doFlip()};
  flip.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doFlip()}};
  document.getElementById('wnote-speak').onclick=e=>{e.stopPropagation();speak(v.w,0.85)};
  document.getElementById('wnote-again').onclick=()=>wnoteNext(v,false);
  document.getElementById('wnote-got').onclick=()=>wnoteNext(v,true);
}
function wnoteNext(v,ok){
  const r=PROG.phrases[v.id]||(PROG.phrases[v.id]=newPhraseRec());
  if(ok){r.correct++;srsGrade(r,2);wnoteState.got++;comboHit(true);addXP('phrase_bookmark')}
  else{r.incorrect++;srsGrade(r,0);comboHit(false)}
  commit();
  wnoteState.i++;renderWordNotebookCard();
}
function renderWordNotebookDone(){
  const el=document.getElementById('screen-review');
  const {got,deck}=wnoteState;
  PROG.commuteSessions=(PROG.commuteSessions||0)+1;commit();checkClearBadges();
  const remain=unknownVocab().length;
  if(got===deck.length&&deck.length>0)launchConfetti();
  const mood=got===deck.length?'win':(got>=deck.length*0.6?'hello':'cheer');
  el.innerHTML=`${sparkHeroHTML(mood)}
    <div class="card result-card">
    <div class="result-score">${got} / ${deck.length}</div>
    <div class="result-msg">単語帳セッション完了！${remain>0?`ノートに残り ${remain} 語。少しずつ潰していこう。`:'ノートが空になりました。素晴らしい！'}</div>
    ${todayGrowthHTML()}
    <button class="btn btn-gold btn-block" style="margin-top:12px" onclick="go('toeic')">TOEICへ ${ICONS.arrowRight}</button>
  </div>`;
}
function wordNotebookCardHTML(){
  const n=unknownVocab().length;
  return `<div class="card glow-card" id="wnote-entry" role="button" tabindex="0" aria-label="単語帳を開く" style="cursor:pointer">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ember),var(--gold));display:flex;align-items:center;justify-content:center;color:var(--night)">${ICONS.bookmark}</div>
        <div><div style="font-weight:700;font-size:var(--text-sm)">単語帳</div>
        <div style="font-size:11px;color:var(--text-muted)">${n>0?`知らなかった単語 ${n}語`:'まだノートは空です'}</div></div>
      </div>
      <div style="color:var(--ember);font-weight:800;font-size:var(--text-sm)">${n>0?'START':'OPEN'} ${ICONS.arrowRight}</div>
    </div>
  </div>`;
}

/* ========== ONBOARDING ========== */
const OB_STATE={page:1,toeicGoal:650,dest:'',date:'',returning:false};
function initOnboarding(){
  OB_STATE.returning=!!localStorage.getItem(LS.seen);
  OB_STATE.page=1;
  const ob=document.getElementById('onboarding');
  ob.classList.remove('hidden');
  ob.innerHTML=`<div class="ob-stars" id="ob-stars"></div><div id="ob-body"></div>`;
  const stars=document.getElementById('ob-stars');
  let s='';for(let i=0;i<40;i++){const sz=Math.random()*2.5+1;s+=`<div class="st" style="width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${Math.random()*2+1.5}s;--dl:${Math.random()*3}s"></div>`}
  stars.innerHTML=s;
  renderObPage();
}
function closeOnboardSplash(){
  sfx('tap');
  document.getElementById('onboarding').classList.add('hidden');
  startApp();
}
function obDotsHTML(){
  return `<div class="ob-dots">${[1,2,3].map(n=>`<div class="dot${n===OB_STATE.page?' on':''}"></div>`).join('')}</div>`;
}
function renderObPage(){
  const body=document.getElementById('ob-body');
  if(OB_STATE.page===1)return renderObSlide1(body);
  if(OB_STATE.page===2)return renderObSlide2(body);
  if(OB_STATE.page===3)return renderObSlide3(body);
}
function renderObSlide1(body){
  const skipFn=OB_STATE.returning?'closeOnboardSplash()':'finishOnboarding()';
  const ctaFn=OB_STATE.returning?'closeOnboardSplash()':'obNext()';
  body.innerHTML=`
    <button class="ob-skip" onclick="${skipFn}">スキップ</button>
    <div class="ob-photo-hero" id="ob-globe">
      <img class="ob-photo-bg" src="sparkle_assets/onboarding_hero.jpg" alt="" aria-hidden="true">
      <img class="ob-photo-img" src="sparkle_assets/onboarding_hero.jpg" alt="" onerror="this.remove();this.previousElementSibling.remove();var f=document.getElementById('ob-globe-fallback');if(f)f.style.display='flex'">
      <div class="ob-globe-wrap" id="ob-globe-fallback" style="display:none">
        <div class="ob-globe-wrap-inner">
          <div class="ob-orbit"><div class="ob-plane">${ICONS.plane}</div></div>
          <div class="ob-globe"></div>
        </div>
      </div>
    </div>
    <div style="flex:1;min-height:6px"></div>
    <div style="position:relative;z-index:2;padding:0 var(--space-xl)">
      <div class="ob-kicker" id="ob-k">A journey begins</div>
      <div class="tagline" id="ob-tag">English becomes<br><span style="color:var(--gold)">your adventure.</span></div>
    </div>
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:0 var(--space-xl) calc(var(--space-lg) + env(safe-area-inset-bottom,0px))">
      <div class="ob-sub" id="ob-sub">通勤5分で、世界を旅する英語。<br>Sparkと一緒に、7つの街を巡ろう。</div>
      ${OB_STATE.returning?'':obDotsHTML()}
      <button class="btn btn-gold ob-cta" id="ob-cta" style="width:100%;max-width:320px;margin-top:${OB_STATE.returning?'var(--space-lg)':'0'}" onclick="${ctaFn}">はじめる ${ICONS.arrowRight}</button>
    </div>`;
  if(window.gsap&&!PREF_REDUCED){
    const tl=gsap.timeline();
    tl.from('#ob-globe',{opacity:0,scale:1.06,duration:1.0,ease:'power2.out'})
      .from('#ob-k',{opacity:0,y:8,duration:0.4},'-=0.4')
      .from('#ob-tag',{filter:'blur(10px)',opacity:0,duration:0.7,ease:'power2.out'},'-=0.2')
      .from('#ob-sub',{opacity:0,y:10,duration:0.4},'-=0.3');
    if(!OB_STATE.returning)tl.from('.ob-dots',{opacity:0,duration:0.3},'-=0.1');
    tl.from('#ob-cta',{y:18,opacity:0,duration:0.4});
  }
}
function renderObSlide2(body){
  const goals=[400,500,600,650,700,800];
  body.innerHTML=`
    <button class="ob-skip" onclick="finishOnboarding()">スキップ</button>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:var(--space-xl);text-align:center">
      <div class="ob-kicker">Set your goal</div>
      <div class="tagline">TOEICの目標を<br><span style="color:var(--gold)">教えて</span></div>
      <div class="ob-sub">目標があると、学習内容が最適化されます。<br>あとで変更できます。</div>
      <div class="ob-target" id="ob-goals">${goals.map(g=>`<button class="${g===OB_STATE.toeicGoal?'on':''}" data-goal="${g}">${g}<div class="ob-target-sub">${g<500?'入門':g<650?'基礎':g<750?'中級':'上級'}</div></button>`).join('')}</div>
      ${obDotsHTML()}
      <button class="btn btn-gold ob-cta" style="min-width:220px" onclick="obNext()">次へ ${ICONS.arrowRight}</button>
    </div>`;
  body.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{OB_STATE.toeicGoal=+b.dataset.goal;body.querySelectorAll('[data-goal]').forEach(x=>x.classList.remove('on'));b.classList.add('on');sfx('tap')});
  anim('.ob-target button',{opacity:0,y:12},{opacity:1,y:0,duration:0.35,stagger:0.04,ease:'power2.out'});
}
function renderObSlide3(body){
  body.innerHTML=`
    <button class="ob-skip" onclick="finishOnboarding()">スキップ</button>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:var(--space-xl);text-align:center">
      <div class="ob-kicker">Where to?</div>
      <div class="tagline">最初の旅先を<br><span style="color:var(--gold)">教えて</span></div>
      <div class="ob-sub">目標があると学習が続きます。ホーム画面にカウントダウンが表示されます。</div>
      <div class="ob-field"><label>行き先（例：パリ／NY／オーランド）</label><input id="ob-dest" type="text" placeholder="Paris" value="${esc(OB_STATE.dest)}"></div>
      <div class="ob-field"><label>出発日</label><input id="ob-date" type="date" value="${OB_STATE.date}"></div>
      ${obDotsHTML()}
      <button class="btn btn-gold btn-block ob-cta" style="max-width:320px" onclick="finishOnboarding()">Sparkleを始める ${ICONS.arrowRight}</button>
    </div>`;
  anim('.ob-field',{opacity:0,y:12},{opacity:1,y:0,duration:0.4,stagger:0.08});
}
function obNext(){sfx('tap');OB_STATE.page=Math.min(3,OB_STATE.page+1);renderObPage()}
function finishOnboarding(){
  const dEl=document.getElementById('ob-dest'),tEl=document.getElementById('ob-date');
  if(dEl)OB_STATE.dest=dEl.value;
  if(tEl)OB_STATE.date=tEl.value;
  if(OB_STATE.dest||OB_STATE.date)saveTravel({destination:OB_STATE.dest,date:OB_STATE.date});
  PROG.toeicGoal=OB_STATE.toeicGoal;commit();
  localStorage.setItem(LS.seen,'1');
  document.getElementById('onboarding').classList.add('hidden');
  startApp();
}

/* ========== INIT ========== */
function startApp(){
  const prevActive=PROG.lastActiveDate;
  PROG.lastActiveDate=todayStr();commit();
  const login=claimLoginBonus();
  updateStreak();checkClearBadges();preloadSparkAssets();
  buildNav();go('home');
  if(login)setTimeout(()=>{showToast('ログインボーナス Day'+login.day+'：+'+login.xp+' XP'+(login.freeze?' ＋保護1個':''));sfx('unlock')},800);
  maybeShowReminder();
  maybeWelcomeBack(prevActive);
  // Register Service Worker (silently fail on file://)
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  // Install-to-Home prompt handling
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._sparkleInstall=e});
}
initOnboarding();
</script>
</body>
</html>
