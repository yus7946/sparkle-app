      <div id="tip-pcts" style="display:flex;gap:8px;flex-wrap:wrap">${pcts.map(p=>`<button class="btn ${p===tipState.pct?'btn-gold':'btn-secondary'} tip-pct" data-pct="${p}" style="flex:1;min-width:60px">${p}%</button>`).join('')}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span style="font-size:12px;color:var(--text-muted)">カスタム</span>
        <input id="tip-custom" type="number" inputmode="numeric" placeholder="%" style="width:80px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text-primary)">
      </div>
      <div style="font-size:12px;color:var(--text-muted);font-weight:700;margin:16px 0 6px">割り勘（人数）</div>
      <div style="display:flex;align-items:center;gap:14px">
        <button class="btn btn-secondary" id="tip-minus" style="width:48px;font-size:var(--text-lg)">−</button>
        <div id="tip-split" style="font-size:var(--text-xl);font-weight:800;min-width:40px;text-align:center">${tipState.split}</div>
        <button class="btn btn-secondary" id="tip-plus" style="width:48px;font-size:var(--text-lg)">＋</button>
        <span style="color:var(--text-muted);font-size:var(--text-sm)">人</span>
      </div>
    </div>
    <div class="card" style="background:linear-gradient(135deg,rgba(29,158,117,.12),rgba(245,200,76,.10))">
      <div style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:var(--text-secondary)">チップ</span><span id="tip-tip" style="font-weight:800;font-size:var(--text-lg)">$0.00</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)"><span style="color:var(--text-secondary)">合計</span><span id="tip-total" style="font-weight:800;font-size:var(--text-xl);color:var(--gold)">$0.00</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:var(--text-secondary)">1人あたり</span><span id="tip-per" style="font-weight:800;font-size:var(--text-lg)">$0.00</span></div>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:var(--text-sm);margin-bottom:8px">${ICONS.star||''} アメリカのチップ目安</div>
      <div style="font-size:12px;color:var(--text-secondary);line-height:1.9">
        ・着席レストラン：<b>18〜20%</b>（標準は20%）<br>
        ・カウンター/クイックサービス：基本不要<br>
        ・バー：1杯につき$1〜2<br>
        ・ホテルの荷物係：1個$1〜2 / ハウスキーピング：1日$3〜5<br>
        ・タクシー/配車：15〜18%<br>
        ・<b>WDW注意</b>：6名以上のグループはチップ（gratuity）が自動加算される場合あり。伝票を確認。
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:var(--text-sm);margin-bottom:8px">${ICONS.play||''} 会計で使える英語</div>
      ${[["Can we get separate checks?","お会計は別々にできますか？"],["Is gratuity included?","チップは含まれていますか？"],["Can I add the tip on the card?","チップはカードに追加できますか？"],["Keep the change.","おつりは取っておいてください。"]].map(([en,ja])=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--border)"><button class="icon-btn tip-speak" data-say="${esc(en)}" aria-label="発音">${ICONS.play}</button><div><div style="font-size:var(--text-sm);font-weight:600">${esc(en)}</div><div style="font-size:11px;color:var(--text-muted)">${esc(ja)}</div></div></div>`).join('')}
    </div>`;
  const recalc=()=>{
    const bill=parseFloat(document.getElementById('tip-bill').value)||0;
    const tip=bill*tipState.pct/100;
    const total=bill+tip;
    const per=total/Math.max(1,tipState.split);
    document.getElementById('tip-tip').textContent='$'+tip.toFixed(2);
    document.getElementById('tip-total').textContent='$'+total.toFixed(2);
    document.getElementById('tip-per').textContent='$'+per.toFixed(2);
  };
  const setPct=p=>{tipState.pct=p;document.querySelectorAll('.tip-pct').forEach(b=>{const on=+b.dataset.pct===p;b.classList.toggle('btn-gold',on);b.classList.toggle('btn-secondary',!on)});recalc()};
  document.getElementById('tip-bill').oninput=e=>{tipState.bill=e.target.value;recalc()};
  document.querySelectorAll('.tip-pct').forEach(b=>b.onclick=()=>{document.getElementById('tip-custom').value='';setPct(+b.dataset.pct)});
  document.getElementById('tip-custom').oninput=e=>{const v=parseInt(e.target.value);if(!isNaN(v)&&v>=0){document.querySelectorAll('.tip-pct').forEach(b=>b.classList.replace('btn-gold','btn-secondary'));tipState.pct=v;recalc()}};

  document.querySelectorAll('.tip-speak').forEach(b=>b.onclick=()=>{speak(b.dataset.say);sfx('tap')});
  recalc();
  anim(el,{opacity:0,y:12},{opacity:1,y:0,duration:0.35,ease:'power2.out'});
}

  el.querySelectorAll('[data-wmst]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();const id=b.dataset.wmst;

function openIC(){
  // Prioritize unseen, then SRS-due, then rest — spread within a short session of 5 items
  const t=todayStr();
  const due=[],unseen=[],rest=[];
  IC_DECK.forEach(x=>{
    const r=PROG.phrases[x.id];
    if(!r||!r.views)unseen.push(x);
    else if(r.nextReview<=t)due.push(x);
    else rest.push(x);
  });
  const session=[...due,...unseen,...rest].slice(0,5);
  if(!session.length)return showToast('復習可能な項目がありません');
  icState={queue:session,i:0,got:0,startedAt:Date.now()};
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-review');el.classList.add('active');
  window.scrollTo(0,0);renderICStep();
  anim(el,{opacity:0,y:12},{opacity:1,y:0,duration:0.35,ease:'power2.out'});
}
function renderICStep(){
  const el=document.getElementById('screen-review');
  const {queue,i}=icState;
  if(i>=queue.length)return renderICResult();
  const item=queue[i];icState.currentStart=Date.now();
  el.innerHTML=`
    <div class="back-row"><button class="icon-btn" onclick="go('home')" aria-label="終了">${ICONS.arrowLeft}</button><h2>瞬間英作文</h2></div>
    <div class="ic-progress">${i+1} / ${queue.length} · 日本語→英語で即興</div>
    <div style="position:relative">
      <div class="ic-timer" id="ic-timer">0.0s</div>
      <div class="ic-jp">${esc(item.jp)}</div>
    </div>
    <textarea class="ic-input" id="ic-input" placeholder="ここに英語を入力（またはSpeakボタンで声で答える）" autofocus></textarea>
    <div class="ic-actions">
      <button class="btn btn-secondary" id="ic-speak-in" aria-label="声で答える">${ICONS.mic} Speak</button>
      <button class="btn btn-gold" id="ic-reveal-btn">Answer ${ICONS.arrowRight}</button>
    </div>
    <div id="ic-reveal-area"></div>`;
  // Start timer
  clearInterval(icState._t);
  icState._t=setInterval(()=>{const s=((Date.now()-icState.currentStart)/1000).toFixed(1);const el2=document.getElementById('ic-timer');if(el2)el2.textContent=s+'s';else clearInterval(icState._t)},100);
  document.getElementById('ic-reveal-btn').onclick=()=>revealIC(item);
  document.getElementById('ic-speak-in').onclick=()=>icSpeak(item);
  document.getElementById('ic-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();revealIC(item)}});
}
function icSpeak(item){
  const btn=document.getElementById('ic-speak-in');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('音声入力は Chrome で有効です');return}
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;
  btn.classList.add('mic-active');
  rec.onresult=e=>{
    const said=e.results[0][0].transcript;
    document.getElementById('ic-input').value=said;
    revealIC(item);
  };
  rec.onerror=()=>{btn.classList.remove('mic-active');showToast('音声認識エラー')};
  rec.onend=()=>btn.classList.remove('mic-active');
  try{rec.start()}catch{btn.classList.remove('mic-active')}
}
function revealIC(item){
  clearInterval(icState._t);
  const elapsed=((Date.now()-icState.currentStart)/1000).toFixed(1);
  const user=(document.getElementById('ic-input').value||'').trim();
  const area=document.getElementById('ic-reveal-area');
  area.innerHTML=`
    <div style="font-size:var(--text-xs);color:var(--text-muted);text-align:center;margin-bottom:8px">回答時間: ${elapsed}秒 ${elapsed<=3?'⚡ Fast!':elapsed<=6?'👍 Good':'ゆっくり'}</div>
    <div class="ic-reveal">
      <div class="ic-reveal-en">${esc(item.en)}</div>
      <div class="ic-reveal-pron">${esc(item.pron)}</div>
      <div style="display:flex;gap:6px;margin-top:10px"><button class="icon-btn" id="ic-play" aria-label="発音">${ICONS.play}</button>
      <button class="icon-btn" id="ic-play-slow" aria-label="ゆっくり">${ICONS.play}<span style="font-size:9px;margin-left:2px">×0.6</span></button></div>
      ${item.alt&&item.alt.length?`<div class="ic-alt"><strong>他の言い方:</strong><br>${item.alt.map(a=>'・ '+esc(a)).join('<br>')}</div>`:''}
      ${item.tip?`<div class="ic-alt" style="margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.08)"><strong>Tip:</strong> ${esc(item.tip)}</div>`:''}
    </div>
    ${user?`<div style="font-size:var(--text-xs);color:var(--text-muted);margin-bottom:4px">あなたの回答:</div><div style="padding:10px;background:var(--surface);border-radius:10px;font-size:var(--text-sm);margin-bottom:12px">${esc(user)}</div>`:''}
    <div style="font-size:var(--text-xs);color:var(--text-muted);text-align:center;margin-bottom:4px">自己評価</div>
    <div class="ic-self-eval">
      <button class="ng" data-ev="ng">言えなかった</button>
      <button class="mid" data-ev="mid">惜しい</button>
      <button class="ok" data-ev="ok">言えた</button>
    </div>`;
  document.getElementById('ic-play').onclick=()=>speak(item.en,0.92);
  document.getElementById('ic-play-slow').onclick=()=>speak(item.en,0.6);
  area.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>icNext(item,b.dataset.ev));
  sfx('tap');
}
function icNext(item,ev){
  const ok=ev==='ok',mid=ev==='mid';
  const r=PROG.phrases[item.id]||(PROG.phrases[item.id]=newPhraseRec());
  r.views++;
  if(ok){r.correct++;srsGrade(r,2);icState.got++;addXP('phrase_bookmark')}
  else if(mid){srsGrade(r,1)}
  else{r.incorrect++;srsGrade(r,0)}
  commit();sfx(ok?'correct':mid?'tap':'wrong');comboHit(ok);
  icState.i++;renderICStep();
}
function renderICResult(){
  const el=document.getElementById('screen-review');
  const {got,queue,startedAt}=icState;
  const totalTime=Math.round((Date.now()-startedAt)/1000);
  const min=Math.floor(totalTime/60),sec=totalTime%60;
  if(got===queue.length)launchConfetti();
  const mood=got===queue.length?'win':(got>=queue.length*0.6?'hello':'cheer');
  el.innerHTML=`${sparkHeroHTML(mood)}
    <div class="card result-card">
    <div class="result-score">${got} / ${queue.length}</div>
    <div class="result-msg">セッション完了！ 所要時間: ${min}分${sec}秒<br>${got===queue.length?'完璧！瞬発力が上がっています。':'間違えた表現は数日後にまた出題されます。'}</div>
    ${inDaySession()?sessionNavHTML():`<div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-secondary" style="flex:1" onclick="go('home')">Home</button>
      <button class="btn btn-gold" style="flex:1" onclick="openIC()">Another Set ${ICONS.arrowRight}</button>
    </div>`}
  </div>`;
}

function journeyProgress(){return (PROG.journey||[]).length}
function journeyDone(id){return (PROG.journey||[]).includes(id)}
function storiesClearedCount(){return (PROG.stories||[]).length}
function journeyLocked(ch){return storiesClearedCount()<ch.unlockCond}
function journeyHeroHTML(){
  const done=journeyProgress(),total=JOURNEY.length;
  return `<div class="journey-hero">
    <div class="journey-sub">The Journey of Spark</div>
    <div class="journey-title">Sparkと巡る言葉の旅 <span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:400">${done}/${total}</span></div>
    <div class="journey-desc">星のかけらから生まれたSparkが、あなたと一緒に言葉を覚えていく物語。都市ストーリーを進めるとチャプターが開放されます。</div>
    <div class="journey-chapters">${JOURNEY.map(ch=>{
      const locked=journeyLocked(ch);
      const cleared=journeyDone(ch.id);
      return `<div class="jc-item${locked?' locked':''}${cleared?' cleared':''}" data-journey="${ch.id}" role="button" tabindex="${locked?-1:0}" aria-label="Chapter ${ch.n}">
        <div class="jc-num">${cleared?ICONS.check:locked?ICONS.lock:ch.n}</div>
        <div class="jc-body">
          <div class="jc-name">Ch.${ch.n} · ${locked?'???':esc(ch.title)}</div>
          <div class="jc-sub">${locked?'ストーリーを '+ch.unlockCond+' 個クリアで開放':esc(ch.titleJa)}</div>
        </div>
        <div class="jc-arrow">${locked?'':ICONS.arrowRight}</div>
      </div>`;
    }).join('')}</div>
  </div>`;
}
let journeyState=null;
function openJourney(id){
  const ch=JOURNEY.find(c=>c.id===id);
  if(!ch||journeyLocked(ch))return;
  journeyState={ch,step:0,history:[]};
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-review');el.classList.add('active');
  window.scrollTo(0,0);renderJourneyIntro();
  anim(el,{opacity:0,y:12},{opacity:1,y:0,duration:0.4,ease:'power2.out'});
}
function renderJourneyIntro(){
  const el=document.getElementById('screen-review');
  const {ch}=journeyState;
  el.innerHTML=`<div class="back-row"><button class="icon-btn" onclick="go('home')" aria-label="戻る">${ICONS.arrowLeft}</button><h2>Chapter ${ch.n}</h2></div>

    </div>`;
  if(window.gsap&&!PREF_REDUCED)gsap.from('.card',{filter:'blur(6px)',opacity:0,duration:0.7,ease:'power2.out'});
}
function startJourneyDialog(){renderJourneyStep()}
function renderJourneyStep(){
  const el=document.getElementById('screen-review');
  const {ch,step,history}=journeyState;
  let html=`<div class="back-row"><button class="icon-btn" onclick="go('home')" aria-label="戻る">${ICONS.arrowLeft}</button><h2>${esc(ch.title)}</h2></div><div class="chat">`;
  history.forEach(h=>{
    if(h.type==='char')html+=`<div class="msg msg-char"><div class="bubble">${esc(h.en)}</div><div class="bubble-ja">${esc(h.ja)}</div></div>`;
    else html+=`<div class="msg msg-user"><div class="bubble">${esc(h.en)}</div></div>`;
  });
  html+='</div>';
  const turn=ch.turns[step];
  if(turn&&turn.who==='char'){
    journeyState.history.push({type:'char',en:turn.en,ja:turn.ja});
    journeyState.step++;return renderJourneyStep();
  }
  if(turn&&turn.who==='user'){
    html+='<div id="j-choices">'+turn.choices.map((c,i)=>`<button class="choice-btn" data-ji="${i}">${esc(c.en)}<span class="cja">${esc(c.ja)}</span></button>`).join('')+'</div>';
    el.innerHTML=html;
    el.querySelectorAll('[data-ji]').forEach(b=>b.onclick=()=>pickJourneyChoice(+b.dataset.ji));
    anim('.chat .msg:last-child',{opacity:0,y:8},{opacity:1,y:0,duration:0.3});
  }else{
    // Complete
    if(!journeyDone(ch.id)){PROG.journey=PROG.journey||[];PROG.journey.push(ch.id);addXP('conv_complete');commit();launchConfetti()}
    html+=sparkHeroHTML('win')+`<div class="card result-card">
      <div class="result-score">Chapter ${ch.n} 完了</div>
      <div class="result-msg">${esc(ch.title)} を読み終えました。次のチャプターは、都市ストーリーをさらに進めると開放されます。</div>
      <button class="btn btn-gold btn-block" onclick="go('home')">Home ${ICONS.arrowRight}</button></div>`;
    el.innerHTML=html;
  }
}
function pickJourneyChoice(i){
  const {ch,step}=journeyState;
  const turn=ch.turns[step];
  const choice=turn.choices[i];
  const box=document.getElementById('j-choices');
  const btns=box.querySelectorAll('.choice-btn');
  btns.forEach((b,idx)=>{b.disabled=true;if(idx===i)b.classList.add('q-'+choice.q)});
  sfx(choice.q==='ng'?'wrong':'correct');
  box.insertAdjacentHTML('afterend',`<div><div class="fb-box fb-${choice.q}">${esc(choice.fb)}</div>
    <button class="btn btn-primary btn-block" id="j-next">Next ${ICONS.arrowRight}</button></div>`);
  if(!PREF_REDUCED&&window.gsap)gsap.fromTo(btns[i],{scale:1},{scale:1.03,duration:0.1,yoyo:true,repeat:1});
  document.getElementById('j-next').onclick=()=>{journeyState.history.push({type:'user',en:choice.en});journeyState.step++;renderJourneyStep()};
}

/* ========== SOUND (Web Audio API) ========== */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch{}}return AC}
function tone(freq,dur,type,gain){
  const c=ac();if(!c||localStorage.getItem('sparkle_mute')==='1')return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,c.currentTime);
  g.gain.setValueAtTime(gain||0.15,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(dur||0.2));
  o.connect(g);g.connect(c.destination);
  o.start();o.stop(c.currentTime+(dur||0.2));
}
function sfx(kind){
  switch(kind){
    case 'correct':tone(660,0.08,'triangle',0.14);setTimeout(()=>tone(990,0.14,'triangle',0.14),80);break;
    case 'wrong':tone(220,0.15,'square',0.08);setTimeout(()=>tone(180,0.18,'square',0.07),120);break;
    case 'tap':tone(880,0.03,'sine',0.05);break;
    case 'unlock':tone(523,0.1,'triangle',0.15);setTimeout(()=>tone(659,0.1,'triangle',0.15),100);setTimeout(()=>tone(784,0.2,'triangle',0.16),200);break;
    case 'levelup':tone(440,0.1,'sine',0.15);setTimeout(()=>tone(554,0.1,'sine',0.15),100);setTimeout(()=>tone(659,0.1,'sine',0.15),200);setTimeout(()=>tone(880,0.3,'sine',0.16),300);break;
  }
}

const SPARK_LEVELS=[
  {lv:1,name:'Baby Spark',min:0,max:99,label:'たまごスパーク'},

  {lv:3,name:'Star Spark',min:500,max:Infinity,label:'スタースパーク'},

function sparkLevel(xp){return SPARK_LEVELS.find(l=>xp>=l.min&&xp<=l.max)||SPARK_LEVELS[0]}
function sparkLines(){
  const xp=PROG.xp||0,lv=sparkLevel(xp),streak=getStreak(),due=totalDue();
  const h=new Date().getHours();
  if(streak>=7)return{en:`${streak} days in a row — you're unstoppable!`,ja:`${streak}日連続！すごい！`};
  if(due>=5)return{en:`${due} phrases waiting for review. Let's go!`,ja:`${due}個の復習が待ってるよ！`};
  if(lv.lv===3)return{en:"You've grown so much. I'm proud of you!",ja:"すごく成長したね。誇らしいよ！"};
  if(lv.lv===2)return{en:"We're getting stronger together!",ja:"一緒に強くなってるね！"};
  if(h<10)return{en:"Good morning! Ready for today's adventure?",ja:"おはよう！今日の冒険、はじめよう！"};
  if(h>=22)return{en:"Just 5 minutes before bed?",ja:"寝る前に5分だけどう？"};
  return{en:"Hi! Let's practice together.",ja:"やあ！一緒に練習しよう。"};
}

// 「今日の目的地」＝難易度順で最初に未クリアの都市（直線的な旅の進行）。全クリア後は最終都市に留まる。
function todaysCity(){
  const next=CITY_ROTATION.find(c=>(CITY_STORIES[c.key]||[]).some(s=>!storyDone(s.id)));
  return next||CITY_ROTATION[CITY_ROTATION.length-1];
}
function storyDone(id){return (PROG.stories||[]).includes(id)}
function markStoryDone(id){PROG.stories=PROG.stories||[];if(!PROG.stories.includes(id)){PROG.stories.push(id);PROG.commuteSessions=(PROG.commuteSessions||0)+1;addXP('conv_complete');commit();checkClearBadges();launchConfetti()}}
function storyCardHTML(cityKey,st){
  const done=storyDone(st.id);
  return `<div class="card story-card glow-card" data-story="${cityKey}:${st.id}" style="--sty-color:${st.color}" role="button" tabindex="0" aria-label="${st.title}">
    ${done?'<div class="story-done">Story</div>':''}
    <div class="story-loc">${esc(st.scene)}</div>
    <div class="story-title">${esc(st.title)}</div>
    <div class="story-ja">${esc(st.titleJa)}</div>
    <div class="story-meta"><div class="avatar" style="background:${st.char.color}">${st.char.avatar}</div>${esc(st.char.name)} · ${esc(st.char.role)} · ${st.estMin}min</div>
  </div>`;
}
let storyState=null;
function openStory(cityKey,storyId){
  const st=(CITY_STORIES[cityKey]||[]).find(s=>s.id===storyId);

function todayStr(){return new Date().toISOString().slice(0,10)}

/* ========== SRS (SM-2ベース分散学習アルゴリズム) ==========
   grade: 2=正解(自信あり) / 1=正解だが不安・惜しい / 0=不正解
   忘却曲線に沿ってEF(易しさ係数)を調整し、間隔を指数的に伸ばす。 */
function srsGrade(rec,grade){
  rec.ef=rec.ef==null?2.5:rec.ef;
  rec.reps=rec.reps||0;
  rec.lastOk=grade>0; // ミスノート判定用：直近の解答が正解か
  const q=grade===2?5:grade===1?3:1; // SM-2の0-5評価にマッピング
  if(grade===0){
    rec.reps=0;rec.interval=1;
    rec.ef=Math.max(1.3,rec.ef-0.2);
  }else{
    rec.reps++;
    if(rec.reps===1)rec.interval=1;
    else if(rec.reps===2)rec.interval=grade===1?3:4;
    else rec.interval=Math.round((rec.interval||1)*rec.ef);
    rec.ef=Math.max(1.3,rec.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  }
  rec.nextReview=addDays(rec.interval);
  return rec;
}
function newPhraseRec(){return{views:0,correct:0,incorrect:0,nextReview:todayStr(),interval:1,ef:2.5,reps:0}}
function recordPhraseView(id){
  const first=!PROG.phrases[id];
  const p=PROG.phrases[id]||(PROG.phrases[id]=newPhraseRec());
  p.views++;addXP('phrase_view');
  if(first&&!PROG.badges.includes('first_phrase'))unlockBadge('first_phrase');
  if(Object.keys(PROG.phrases).length>=100)unlockBadge('phrase_100');
  commit();
}
function srsAnswer(id,ok){
  const p=PROG.phrases[id]||(PROG.phrases[id]=newPhraseRec());
  if(ok){p.correct++;srsGrade(p,2)}
  else{p.incorrect++;srsGrade(p,0)}
  commit();
}

function updateStreak(){
  let s;try{s=JSON.parse(localStorage.getItem(LS.streak))}catch{}
  s=s||{date:'',count:0};
  const t=todayStr();
  if(s.date===t){checkTimeBadges();return s.count}

  if(s.date===yesterday){
    s.count=s.count+1;
  }else if(s.date===twoDaysAgo&&(PROG.streakFreezes||0)>0){
    PROG.streakFreezes--;s.count=s.count+1;usedFreeze=true;
  }else{

  s.date=t;

  if(usedFreeze)setTimeout(()=>showToast('ストリーク保護を使用：連続'+s.count+'日を継続'),600);

  if(s.count>=7)unlockBadge('streak_7');

  {id:'p5_14',stem:"The customer complained ____ the quality of the product.",choices:["about","for","with","on"],correct:0,exp:"complain about ~ = 〜について不平を言う。前置詞暗記。"},
  {id:'p5_15',stem:"Please ____ that all documents are attached.",choices:["ensure","assure","insure","secure"],correct:0,exp:"ensure that = 〜を確実にする。assure（人）とinsure（保険）の違いは頻出。"},
  {id:'p5_16',stem:"The ____ of the new system improved efficiency.",choices:["implement","implementation","implemented","implementing"],correct:1,exp:"The ___ of の形は名詞が入る。implementation（実施）。品詞問題は語尾で判断。"},
  {id:'p5_17',stem:"The team worked ____ to meet the deadline.",choices:["efficient","efficiency","efficiently","efficiencies"],correct:2,exp:"動詞 worked を修飾するのは副詞 efficiently。-ly が目印。"},
  {id:'p5_18',stem:"We received several ____ comments about the service.",choices:["favor","favorable","favorably","favored"],correct:1,exp:"名詞 comments を修飾するのは形容詞 favorable（好意的な）。"},
  {id:'p5_19',stem:"The candidate ____ we interviewed yesterday was impressive.",choices:["which","who","whose","what"],correct:1,exp:"人を指し、interviewed の目的語となる関係代名詞 who。物なら which。"},
  {id:'p5_20',stem:"The company, ____ headquarters are in Tokyo, is expanding.",choices:["which","who","whose","that"],correct:2,exp:"所有を表す関係代名詞 whose（〜の本社）。後ろに名詞が続くのが目印。"},
  {id:'p5_21',stem:"The instructions were ____ and hard to follow.",choices:["confuse","confusing","confused","confusion"],correct:1,exp:"物が「混乱させる」→ -ing 形容詞 confusing。人が混乱なら confused。"},
  {id:'p5_22',stem:"The ____ customers left positive reviews.",choices:["satisfy","satisfying","satisfied","satisfaction"],correct:2,exp:"人が「満足させられた」状態 → -ed 形容詞 satisfied。分詞形容詞の頻出パターン。"},
  {id:'p5_23',stem:"The number of applicants ____ increased this year.",choices:["have","has","are","were"],correct:1,exp:"The number of ~ は単数扱い → has。A number of ~（多数の）なら複数扱い。"},
  {id:'p5_24',stem:"Each of the employees ____ a personal locker.",choices:["have","has","having","are"],correct:1,exp:"Each of ~ は単数扱い → has。TOEIC頻出の主述一致トラップ。"},
  {id:'p5_25',stem:"Please give the documents to Mr. Lee and ____.",choices:["I","me","my","mine"],correct:1,exp:"前置詞 to の目的語なので目的格 me。and の後でも格は変わらない。"},
  {id:'p5_26',stem:"The manager completed the project by ____.",choices:["her","hers","herself","she"],correct:2,exp:"by oneself = 独力で。再帰代名詞 herself。"},
  {id:'p5_27',stem:"She is interested in ____ abroad next year.",choices:["work","to work","working","worked"],correct:2,exp:"前置詞 in の後は動名詞 working。be interested in ~ing。"},
  {id:'p5_28',stem:"We hired more staff ____ the growing demand.",choices:["to meet","meeting","met","for meet"],correct:0,exp:"目的を表す to不定詞（〜するために）。to meet demand = 需要に応えるため。"},
  {id:'p5_29',stem:"____ new skills takes time and effort.",choices:["Learn","Learned","Learning","To learning"],correct:2,exp:"主語になる動名詞 Learning。takes（単数）とも一致。"},
  {id:'p5_30',stem:"This model is far ____ than the previous one.",choices:["good","well","better","best"],correct:2,exp:"than があるので比較級 better。far は比較級を強調する副詞。"},
  {id:'p5_31',stem:"It was the ____ presentation of the entire conference.",choices:["impress","impressive","most impressive","more impressive"],correct:2,exp:"the + 最上級。of the entire ~ が最上級の目印。"},
  {id:'p5_32',stem:"____ the delay, the project was completed on time.",choices:["Despite","Although","Because","So that"],correct:0,exp:"Despite + 名詞（〜にもかかわらず）。Although は節をとるので不可。"},
  {id:'p5_33',stem:"____ it was raining heavily, the outdoor event continued.",choices:["Despite","Although","In spite of","Due to"],correct:1,exp:"Although + 節（S+V）。Despite/In spite of は名詞をとる。品詞で判断。"},
  {id:'p5_34',stem:"The instructions were ____ clear that no one had questions.",choices:["such","so","too","very"],correct:1,exp:"so + 形容詞 + that（とても〜なので…）。such は名詞を伴う。"},
  {id:'p5_35',stem:"It was ____ a successful launch that sales doubled.",choices:["so","such","too","very"],correct:1,exp:"such + a + 形容詞 + 名詞 + that。so との使い分けが頻出。"},
  {id:'p5_36',stem:"The package was ____ heavy to carry alone.",choices:["so","too","very","enough"],correct:1,exp:"too + 形容詞 + to do（〜すぎて…できない）。否定の意味を含む。"},
  {id:'p5_37',stem:"The meeting room is large ____ for fifty people.",choices:["enough","too","so","much"],correct:0,exp:"形容詞 + enough（十分〜）。enough は形容詞の後ろに置く語順に注意。"},
  {id:'p5_38',stem:"If you ____ the form today, we will process it immediately.",choices:["submit","submitted","will submit","would submit"],correct:0,exp:"条件のif節では未来のことも現在形。主節が will なら仮定法過去ではない。"},
  {id:'p5_39',stem:"If I ____ the manager, I would revise the current policy.",choices:["am","was","were","be"],correct:2,exp:"仮定法過去。If S were ~, S would ~。現実と異なる仮定は were を使う。"},
  {id:'p5_40',stem:"There isn't ____ information available on this topic.",choices:["many","much","few","several"],correct:1,exp:"information は不可算名詞 → much。many/few は可算名詞用。"},
  {id:'p5_41',stem:"____ employees attended the optional weekend session.",choices:["Few","Little","Much","A great deal of"],correct:0,exp:"employees は可算複数 → Few（ほとんど〜ない）。Little は不可算用。"},
  {id:'p5_42',stem:"By the time we arrived, the meeting ____.",choices:["started","has started","had started","starts"],correct:2,exp:"過去のある時点より前 → 過去完了 had started。By the time + 過去がヒント。"},
  {id:'p5_43',stem:"Ms. Park ____ for this company for over ten years.",choices:["works","worked","has worked","is working"],correct:2,exp:"for + 期間 + 現在まで継続 → 現在完了 has worked。"},
  {id:'p5_44',stem:"The contract ____ by both parties last Friday.",choices:["signed","was signed","has signed","signs"],correct:1,exp:"契約は「署名される側」＝過去の受動態 was signed。last Friday で過去確定。"},
  {id:'p5_45',stem:"You ____ have informed us about the change earlier.",choices:["should","must","will","can"],correct:0,exp:"should have + 過去分詞 = 〜すべきだったのに（後悔・非難）。"},
  {id:'p5_46',stem:"The bonus was divided equally ____ the three team members.",choices:["between","among","with","into"],correct:1,exp:"3者以上は among。2者なら between。TOEIC頻出の前置詞対比。"},
  {id:'p5_47',stem:"The flight departs in about ____ hour.",choices:["a","an","the","some"],correct:1,exp:"hour は発音が母音で始まる（h は無音）→ an。綴りでなく音で判断。"},
  {id:'p5_48',stem:"Please let us know ____ you can attend the seminar.",choices:["whether","despite","during","however"],correct:0,exp:"whether = 〜かどうか（名詞節）。let us know の目的語になる。"},
  {id:'p5_49',stem:"The proposal must be approved ____ the board members.",choices:["by","of","to","for"],correct:0,exp:"受動態の動作主は by。be approved by ~（〜に承認される）。"},
  {id:'p5_50',stem:"Neither the manager nor the staff ____ aware of the change.",choices:["was","were","is","have"],correct:0,exp:"neither A nor B は B に一致。the staff（単数扱い）→ was。"},
  {id:'p5_51',stem:"The ____ of the new policy will begin next month.",choices:["implement","implementation","implementing","implemented"],correct:1,exp:"The ___ of の形は名詞。implementation（実施）が主語になる。"},
  {id:'p5_52',stem:"Employees are expected to act in a ____ manner during client visits.",choices:["professional","professionally","profession","professionalism"],correct:0,exp:"a ___ manner の形は形容詞が名詞 manner を修飾。professional。"},
  {id:'p5_53',stem:"The board reviewed the proposal ____ before making a decision.",choices:["careful","care","carefully","caring"],correct:2,exp:"動詞 reviewed を修飾する副詞 carefully。"},
  {id:'p5_54',stem:"By next year, the firm ____ operations in five new countries.",choices:["will have launched","launches","has launched","launch"],correct:0,exp:"By next year（未来のある時点まで）→ 未来完了 will have launched。"},
  {id:'p5_55',stem:"When the inspector arrived, the workers ____ the site.",choices:["already left","had already left","have already left","leave already"],correct:1,exp:"過去のある時点(arrived)より前の完了 → 過去完了 had already left。"},
  {id:'p5_56',stem:"The CEO ____ a press conference at 10 A.M. tomorrow.",choices:["holds","held","will hold","holding"],correct:2,exp:"tomorrow（未来）→ will hold。"},
  {id:'p5_57',stem:"New employee badges ____ at the security desk every morning.",choices:["issue","are issued","issuing","issues"],correct:1,exp:"badges は「発行される」側 → 受動態 are issued。"},
  {id:'p5_58',stem:"The annual report ____ by the finance team last week.",choices:["was prepared","prepared","prepares","is preparing"],correct:0,exp:"last week（過去）+ 受動態 → was prepared。"},
  {id:'p5_59',stem:"A new customer service line ____ next quarter.",choices:["will be introduced","introduces","introduced","is introducing"],correct:0,exp:"next quarter（未来）+ 受動態 → will be introduced。"},
  {id:'p5_60',stem:"The workshop starts ____ 9 A.M. sharp.",choices:["in","on","at","by"],correct:2,exp:"時刻には at を使う。at 9 A.M.。"},
  {id:'p5_61',stem:"She has worked at this branch ____ 2018.",choices:["for","since","during","within"],correct:1,exp:"since + 起点（〜以来）。for は期間の長さに使う。"},
  {id:'p5_62',stem:"The budget will be split ____ the three departments.",choices:["between","among","with","across from"],correct:1,exp:"3者以上に分ける場合は among。between は2者。"},
  {id:'p5_63',stem:"____ the heavy traffic, the delivery arrived on schedule.",choices:["Despite","Although","Because","So that"],correct:0,exp:"Despite + 名詞句（〜にもかかわらず）。"},
  {id:'p5_64',stem:"The employee ____ submitted the report was praised by the director.",choices:["which","who","whom","whose"],correct:1,exp:"人が主語となる関係代名詞 who。submitted の主語になる。"},
  {id:'p5_65',stem:"Please review the attachment, ____ contains the updated pricing.",choices:["who","which","whom","what"],correct:1,exp:"物を指す関係代名詞 which。先行詞 attachment は物。"},
  {id:'p5_66',stem:"The client ____ contract we renewed last month called again today.",choices:["who","which","whose","that"],correct:2,exp:"所有格の関係代名詞 whose（〜の契約）。後ろに名詞 contract が続く。"},
  {id:'p5_67',stem:"This is the exact model ____ we ordered last time.",choices:["what","which","whom","where"],correct:1,exp:"物を先行詞とする関係代名詞 which（that も可だが選択肢になし）。"},
  {id:'p5_68',stem:"____ the printer was repaired, we could not process any orders.",choices:["Until","Unless","While","As soon as"],correct:0,exp:"Until = 〜するまでずっと（継続を表す接続詞）。修理が終わるまで注文処理できなかった。"},
  {id:'p5_69',stem:"____ you submit the form today, it will not be processed this week.",choices:["Unless","Although","Despite","Even though"],correct:0,exp:"Unless = 〜しない限り。条件を表す接続詞。"},
  {id:'p5_70',stem:"Please arrive early ____ you can find a parking space.",choices:["so that","in order","despite","although"],correct:0,exp:"so that + S + can ~（〜できるように）。目的を表す。"},
  {id:'p5_71',stem:"The manager is ____ organized and detail-oriented.",choices:["both","either","neither","not only"],correct:0,exp:"both A and B（AもBも）。andと対で使う相関接続詞。"},
  {id:'p5_72',stem:"You can pay ____ by credit card or in cash.",choices:["both","either","neither","and"],correct:1,exp:"either A or B（AかBか）。orと対で使う。"},
  {id:'p5_73',stem:"The device is ____ expensive nor particularly reliable.",choices:["both","either","neither","not only"],correct:2,exp:"neither A nor B（AでもBでもない）。norと対で使う。"},
  {id:'p5_74',stem:"The new model is ____ more efficient but also quieter.",choices:["not only","neither","either","both"],correct:0,exp:"not only A but also B（AだけでなくBも）。"},
  {id:'p5_75',stem:"This laptop is ____ than the previous generation.",choices:["light","lighter","lightest","more light"],correct:1,exp:"than があるので比較級 lighter。"},
  {id:'p5_76',stem:"Of all the candidates, she gave the ____ presentation.",choices:["strong","stronger","strongest","more strong"],correct:2,exp:"the + 最上級。of all の後は最上級を選ぶ。"},
  {id:'p5_77',stem:"This year's turnout was ____ as large as last year's.",choices:["as","so","too","such"],correct:0,exp:"as ~ as（同じくらい〜）の原級比較。"},
  {id:'p5_78',stem:"____ the deadline is important for every team member.",choices:["Meet","Met","Meeting","To meeting"],correct:2,exp:"主語になる動名詞 Meeting。動詞のまま主語にはできない。"},
  {id:'p5_79',stem:"Thank you for ____ us about the schedule change.",choices:["inform","informing","informed","to inform"],correct:1,exp:"前置詞 for の後は動名詞 informing。"},
  {id:'p5_80',stem:"The company hired extra staff ____ the holiday rush.",choices:["handling","to handle","handled","for handling"],correct:1,exp:"目的を表す to不定詞 to handle（〜するために）。"},
  {id:'p5_81',stem:"It is important ____ the safety guidelines before starting.",choices:["review","reviewing","to review","reviewed"],correct:2,exp:"It is + 形容詞 + to do の構文。to review。"},
  {id:'p5_82',stem:"The results were ____ , prompting further investigation.",choices:["surprise","surprising","surprised","surprisingly"],correct:1,exp:"物が「驚かせる」→ -ing 形容詞 surprising。"},
  {id:'p5_83',stem:"The ____ employees received extra training last month.",choices:["interest","interesting","interested","interestingly"],correct:2,exp:"人が「興味を持たされた」状態 → -ed 形容詞 interested。"},
  {id:'p5_84',stem:"There wasn't ____ time to finish the entire agenda.",choices:["many","much","few","several"],correct:1,exp:"time は不可算名詞 → much。"},
  {id:'p5_85',stem:"____ complaints were filed after the new policy took effect.",choices:["Much","Little","Few","A great deal of"],correct:2,exp:"complaints は可算複数 → Few（ほとんどない）。"},
  {id:'p5_86',stem:"A number of employees ____ requested flexible hours.",choices:["has","have","is","was"],correct:1,exp:"A number of ~ は複数扱い → have。The number of ~ は単数扱いなので混同注意。"},
  {id:'p5_87',stem:"Every applicant ____ required to complete an online assessment.",choices:["are","is","were","have been"],correct:1,exp:"Every + 単数名詞 は単数扱い → is。"},
  {id:'p5_88',stem:"The director praised the assistant for finishing the report by ____.",choices:["him","his","himself","he"],correct:2,exp:"by oneself = 独力で。再帰代名詞 himself。"},
  {id:'p5_89',stem:"Please send the invoice to Ms. Lopez or ____.",choices:["I","me","my","myself"],correct:1,exp:"前置詞 to の目的語は目的格 me。"},
  {id:'p5_90',stem:"The company updated ____ website to include a new FAQ page.",choices:["it","its","it's","itself"],correct:1,exp:"所有格 its（会社の＝所有）。it's は it is の短縮形なので不可。"},
  {id:'p5_91',stem:"If the shipment ____ late, please notify the customer immediately.",choices:["arrives","arrive","will arrive","arrived"],correct:0,exp:"条件のif節は未来のことでも現在形。主節が命令文でも同様。"},
  {id:'p5_92',stem:"If we ____ more staff, we could open on weekends.",choices:["have","had","will have","having"],correct:1,exp:"仮定法過去。If S 過去形, S would/could ~（現在の事実と異なる仮定）。"},
  {id:'p5_93',stem:"You ____ have called before visiting; the office was closed.",choices:["should","must","can","will"],correct:0,exp:"should have + 過去分詞 = 〜すべきだった（後悔）。"},
  {id:'p5_94',stem:"All visitors ____ wear an identification badge at all times.",choices:["should","must","might","would"],correct:1,exp:"must = 〜しなければならない（強い義務）。規則の文脈で頻出。"},
  {id:'p5_95',stem:"The instructions were ____ detailed that no one needed help.",choices:["so","such","too","very"],correct:0,exp:"so + 形容詞 + that構文。"},
  {id:'p5_96',stem:"It was ____ complicated a process that we hired a consultant.",choices:["so","such","too","very"],correct:1,exp:"such + a + 形容詞 + 名詞 + that構文。"},
  {id:'p5_97',stem:"The contract was ____ complex for a first-year associate to handle alone.",choices:["so","such","too","enough"],correct:2,exp:"too + 形容詞 + for + 人 + to do（〜するには…すぎる）。"},
  {id:'p5_98',stem:"The intern was skilled ____ to manage the project independently.",choices:["so","too","enough","very"],correct:2,exp:"形容詞 + enough + to do（十分〜なので…できる）。enough は形容詞の後。"},
  {id:'p5_99',stem:"The revised schedule ____ to all department heads by the end of the day.",choices:["will be sent","sends","is sending","send"],correct:0,exp:"schedule は「送られる」側 → 未来受動態 will be sent。"},
  {id:'p5_100',stem:"Applicants are advised ____ their references before the interview.",choices:["contact","to contact","contacting","contacted"],correct:1,exp:"be advised to do（〜するよう助言される）。to不定詞をとる受動構文。"},
];
// Part 1: 写真描写。日本語の情景説明を読み、4つの英文から最も適切に描写したものを選ぶ。各選択肢は音声再生可。
const TOEIC_P1=[
  {id:'p1_01',img:'sparkle_assets/toeic_p1/p1_01.jpg',scene:"男性がノートパソコンに向かってキーボードを打っている。",choices:["A man is typing on a keyboard.","A man is repairing a computer.","A man is turning off a monitor.","A man is unplugging a cable."],correct:0,exp:"typing on a keyboard = キーボードを打つ。P1は「現在進行形＋動作」が基本。repairing(修理)などの引っかけに注意。"},
  {id:'p1_02',img:'sparkle_assets/toeic_p1/p1_02.jpg',scene:"女性が棚から本を取り出そうと手を伸ばしている。",choices:["She is reading a newspaper.","She is reaching for a book on a shelf.","She is stacking boxes on the floor.","She is closing a cabinet."],correct:1,exp:"reach for ~ = 〜に手を伸ばす。動作の対象(book/shelf)が一致するかで判断。"},
  {id:'p1_03',img:'sparkle_assets/toeic_p1/p1_03.jpg',scene:"複数の人がテーブルを囲んで会議をしている。",choices:["People are leaving the room.","They are seated around a table.","A woman is writing on a whiteboard.","Everyone is standing in line."],correct:1,exp:"be seated around a table = テーブルを囲んで座っている。全体の状態を表す受動的描写がP1頻出。"},
  {id:'p1_04',img:'sparkle_assets/toeic_p1/p1_04.jpg',scene:"駐車場に複数の車が停まっている（人はいない）。",choices:["Cars are parked in a lot.","People are getting into cars.","A car is being washed.","Traffic is moving slowly."],correct:0,exp:"be parked = 停まっている（状態）。人が写っていないのに people ~ を選ぶ誤りに注意。"},
  {id:'p1_05',img:'sparkle_assets/toeic_p1/p1_05.jpg',scene:"店員がカウンター越しに客へ商品を手渡している。",choices:["A clerk is handing an item to a customer.","A customer is paying with cash.","They are shaking hands.","A clerk is closing the store."],correct:0,exp:"hand A to B = AをBに手渡す。2人の動作の関係を正確に。paying(支払い)は写っていなければ誤り。"},
  {id:'p1_06',img:'sparkle_assets/toeic_p1/p1_06.jpg',scene:"作業員がヘルメットをかぶって建設現場に立っている。",choices:["Workers are wearing safety helmets.","A building is being demolished.","They are painting a wall.","A crane is lifting materials."],correct:0,exp:"be wearing = 身につけている（状態）。be동작中のput on(着る動作)との違いが頻出。"},
  {id:'p1_07',img:'sparkle_assets/toeic_p1/p1_07.jpg',scene:"空港で乗客がスーツケースを引いて歩いている。",choices:["A passenger is pulling a suitcase.","A plane is taking off.","People are boarding a bus.","A bag is on the conveyor belt."],correct:0,exp:"pull a suitcase = スーツケースを引く。他の選択肢は写真にない要素(plane/bus)の引っかけ。"},
  {id:'p1_08',img:'sparkle_assets/toeic_p1/p1_08.jpg',scene:"女性がカフェのテーブルで飲み物を飲んでいる。",choices:["She is pouring coffee into a cup.","She is drinking from a cup.","A waiter is taking an order.","She is cleaning the table."],correct:1,exp:"drink from a cup = カップから飲む。pour(注ぐ)との動作の違いに注意。"},
  {id:'p1_09',img:'sparkle_assets/toeic_p1/p1_09.jpg',scene:"橋の上を歩行者が渡っている。",choices:["Pedestrians are crossing a bridge.","A boat is passing under a bridge.","The bridge is under construction.","Cars are stuck in traffic."],correct:0,exp:"pedestrian = 歩行者、cross = 渡る。人の動作が主題。背景要素の引っかけを排除。"},
  {id:'p1_10',img:'sparkle_assets/toeic_p1/p1_10.jpg',scene:"男性が書類を相手に見せながら説明している。",choices:["A man is presenting a document.","A man is signing a contract.","They are folding papers.","A man is filing documents."],correct:0,exp:"present a document = 書類を提示する。sign(署名)/file(整理)などの近い動詞の引っかけに注意。"},
  {id:'p1_11',img:'sparkle_assets/toeic_p1/p1_11.jpg',scene:"女性が電話で話しながらメモを取っている。",choices:["She is talking on the phone and taking notes.","She is repairing a telephone.","She is reading a newspaper.","She is closing her laptop."],correct:0,exp:"2つの動作(talking / taking notes)が同時に描写される。両方の動作が一致するか確認。"},
  {id:'p1_12',img:'sparkle_assets/toeic_p1/p1_12.jpg',scene:"男性が倉庫で箱を運んでいる。",choices:["A man is sweeping the floor.","A man is carrying a box.","A man is unloading a truck outside.","A man is stacking chairs."],correct:1,exp:"carry a box = 箱を運ぶ。unloading a truck は写真に描かれていなければ誤り。"},
  {id:'p1_13',img:'sparkle_assets/toeic_p1/p1_13.jpg',scene:"子供たちがバス停で列に並んで待っている。",choices:["Children are boarding a bus.","Children are standing in line.","Children are playing on a playground.","A bus is being repaired."],correct:1,exp:"stand in line = 列に並ぶ。boarding(乗車中)との動作の違いに注意。"},

const TOEIC_PARTS=[
  {n:1,label:'写真描写',en:'Photos'},
  {n:2,label:'応答問題',en:'Q&A'},
  {n:3,label:'会話',en:'Conv.'},
  {n:4,label:'説明文',en:'Talks'},
  {n:5,label:'短文穴埋め',en:'Grammar'},
  {n:6,label:'長文穴埋め',en:'Cloze'},
  {n:7,label:'読解',en:'Reading'},
];
function toeicPhrases(part){
  const list=[];
  Object.values(SCENARIOS).forEach(sc=>{
    sc.phrases.forEach(p=>{
      if(p.toeic&&p.toeic.length&&(part==null||p.toeic.includes(part))){
        list.push({...p,_sc:sc.id})
      }
    });
  });
  return list;
}
function toeicMastered(){
  return toeicPhrases().filter(p=>{const r=PROG.phrases[p.id];return r&&r.correct>=1}).length;
}
function toeicScore(){
  const mastered=toeicAllMastered();
  const total=toeicAllTotal();
  const base=400;
  const gain=Math.round(mastered/Math.max(1,total)*350);
  return Math.min(990,base+gain);
}
function p6Items(){return TOEIC_P6.flatMap(p=>p.blanks.map(b=>({id:p.id+'_b'+b.n,...b})))}
function p7Items(){return TOEIC_P7.flatMap(p=>p.questions.map(q=>({id:q.id,...q})))}
function p3Items(){return TOEIC_P3.flatMap(c=>c.questions.map(q=>({id:q.id,...q})))}
function p4Items(){return TOEIC_P4.flatMap(t=>t.questions.map(q=>({id:q.id,...q})))}
function toeicBank(part){
  if(part===1)return TOEIC_P1;
  if(part===2)return TOEIC_P2;
  if(part===3)return p3Items();
  if(part===4)return p4Items();
  if(part===5)return TOEIC_P5;
  if(part===6)return p6Items();
  if(part===7)return p7Items();
  return [];
}
function toeicPartCount(part){return toeicBank(part).length}
function toeicPartMastered(part){return toeicBank(part).filter(q=>{const r=PROG.phrases[q.id];return r&&r.correct>=1}).length}
function toeicAllMastered(){return [1,2,3,4,5,6,7].reduce((n,p)=>n+toeicPartMastered(p),0)}
function toeicAllTotal(){return [1,2,3,4,5,6,7].reduce((n,p)=>n+toeicPartCount(p),0)}

function toeicHeroHTML(){
  const cur=toeicScore();
  const pct=Math.min(100,Math.round(cur/990*100));
  const goalPct=Math.round(toeicTarget()/990*100);
  const remain=Math.max(0,toeicTarget()-cur);
  return `<div class="toeic-hero">
    <div class="toeic-badge">TOEIC FOCUS</div>
    <div class="toeic-target">Target ${toeicTarget()} まで${remain>0?'あと '+remain+' 点':' 到達！'}</div>
    <div class="toeic-desc">TOEIC頻出項目 ${toeicAllMastered()} / ${toeicAllTotal()} 習得済み。パートを絞って練習しよう。</div>
    <div class="toeic-meter">
      <div class="toeic-meter-top">
        <div class="toeic-score">${cur}</div>
        <div class="toeic-target-num">目標 ${toeicTarget()} / 990</div>
      </div>
      <div class="toeic-bar">
        <div class="toeic-bar-fill" style="width:${pct}%"></div>
        <div class="toeic-bar-goal" style="left:${goalPct}%"></div>
      </div>
    </div>
    <div class="toeic-parts" style="grid-template-columns:repeat(4,1fr)">${TOEIC_PARTS.map(p=>{
      const total=toeicPartCount(p.n);
      const done=toeicPartMastered(p.n);
      return `<div class="toeic-part" data-toeic-part="${p.n}" role="button" tabindex="0" aria-label="Part ${p.n}">
        <div class="toeic-part-num">P${p.n}</div>

        <div class="toeic-part-cnt">${done}/${total}</div>
      </div>`;
    }).join('')}</div>
  </div>`;
}
let toeicPart=null;
function openTOEICPart(part){
  toeicPart=part;
  if(part===5){
    // 50問バンクから毎回15問を出題。未習得・SRS期限到来を優先、残りで補充。
    const t=todayStr();const due=[],rest=[];
    TOEIC_P5.forEach(q=>{const r=PROG.phrases[q.id];if(!r||!r.correct||(r.nextReview&&r.nextReview<=t))due.push(q);else rest.push(q)});
    const pick=[...due.sort(()=>Math.random()-0.5),...rest.sort(()=>Math.random()-0.5)].slice(0,15);
    return openTOEICDrill(pick,5,'Part 5 · 短文穴埋め');
  }
  if(part===1)return openTOEICP1();
  if(part===2)return openTOEICP2(TOEIC_P2);
  if(part===3)return openTOEICP3();
  if(part===4)return openTOEICP4();
  if(part===6)return openTOEICP6();
  if(part===7)return openTOEICP7();
  const list=toeicPhrases(part);
  if(!list.length){showToast('このパートは近日追加予定です');return}
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-review');el.classList.add('active');
  window.scrollTo(0,0);
  const partInfo=TOEIC_PARTS.find(p=>p.n===part);
  el.innerHTML=`
    <div class="back-row"><button class="icon-btn" onclick="go('home')" aria-label="戻る">${ICONS.arrowLeft}</button><h2>TOEIC Part ${part}</h2></div>
    <div class="q-ctx">${partInfo.label} — ${list.length} 頻出フレーズ。タップで発音を確認、右下ボタンで詳細。</div>
    <div id="toeic-list">${list.map(p=>{
      const rec=PROG.phrases[p.id];

function speakScript(txt){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const lines=String(txt).split('\n').map(l=>l.trim()).filter(Boolean);
  const speakerLines=lines.filter(l=>/^[A-Z]:\s*/.test(l));
  if(speakerLines.length<2){
    // 話者ラベルなし（モノローグ=Part4）は単一ナレーターで読む
    speak(String(txt).replace(/^[A-Z]:\s*/gm,'').replace(/\n/g,' '));
    return;
  }
  lines.forEach(l=>{
    const m=l.match(/^([A-Z]):\s*(.*)$/);
    if(!m)return;
    const speaker=m[1],text=m[2];
    const pref=speaker==='W'?'female':speaker==='M'?'male':undefined;
    speakQueue(text,0.92,pref);
  });
}

  const box='font-size:var(--text-sm);color:var(--text-secondary);line-height:1.7;white-space:pre-wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:var(--space-md);margin-bottom:var(--space-md);font-family:Georgia,serif';
  if(part===6){return{id:raw.id,part,promptHTML:`<div style="${box}">${raw.stem}</div>`,question:'空所に入る最も適切なものは？',choices:raw.choices,correct:raw.correct,exp:raw.exp,_html:true};}
  return{id:raw.id,part,promptHTML:`<div style="${box}">${esc(raw.script||raw.passage||'')}</div>`,question:raw.q,choices:raw.choices,correct:raw.correct,exp:raw.exp};
}
function buildMockPool(){
  // Listening 相当
  const p1=TOEIC_P1.map(x=>normalizeMockItem(1,x));
  const p2=TOEIC_P2.map(x=>normalizeMockItem(2,x));
  const p3=TOEIC_P3.flatMap(c=>c.questions.map(q=>normalizeMockItem(3,{...q,script:c.script})));
  const p4=TOEIC_P4.flatMap(t=>t.questions.map(q=>normalizeMockItem(4,{...q,script:t.script})));
  // Reading 相当
  const p5=TOEIC_P5.map(x=>normalizeMockItem(5,x));
  const p6=[];TOEIC_P6.forEach(p=>p.blanks.forEach(b=>{const stem=p.passage.replace(new RegExp('____\\['+b.n+'\\]____','g'),'<span style="color:var(--gold);font-weight:700">____</span>').replace(/____\[\d+\]____/g,'____');p6.push(normalizeMockItem(6,{id:p.id+'_b'+b.n,stem,choices:b.choices,correct:b.correct,exp:b.exp}));}));
  const p7=TOEIC_P7.flatMap(p=>p.questions.map(q=>normalizeMockItem(7,{...q,passage:p.passage})));
  return {p1,p2,p3,p4,p5,p6,p7};
}
function sample(arr,n){return [...arr].sort(()=>Math.random()-0.5).slice(0,n)}

function mistakeItems(){
  const b=buildMockPool();

  let correct=0;const byPart={};
  items.forEach((q,i)=>{const ok=answers[i]===q.correct;if(ok)correct++;byPart[q.part]=byPart[q.part]||{c:0,t:0};byPart[q.part].t++;if(ok)byPart[q.part].c++;
    const rec=PROG.phrases[q.id]||(PROG.phrases[q.id]=newPhraseRec());rec.views++;if(ok){rec.correct++;srsGrade(rec,2)}else{rec.incorrect++;srsGrade(rec,0)}});
  const acc=correct/items.length;
  const est=mockToScore(acc);
  // スコア履歴に保存（推移グラフ用）
  PROG.scoreHist=PROG.scoreHist||[];
  PROG.scoreHist.push({date:todayStr(),ts:Date.now(),score:est,acc:Math.round(acc*100),correct,total:items.length});
  if(PROG.scoreHist.length>60)PROG.scoreHist=PROG.scoreHist.slice(-60);
  addXP('quiz_perfect');PROG.commuteSessions=(PROG.commuteSessions||0)+1;commit();
  const prev=PROG.scoreHist.length>=2?PROG.scoreHist[PROG.scoreHist.length-2].score:null;
  const diff=prev!=null?est-prev:null;
  const target=toeicTarget();
  const passed=est>=target;
  if(passed)launchConfetti();
  const partRows=[1,2,3,4,5,6,7].filter(p=>byPart[p]).map(p=>{const d=byPart[p];const pc=Math.round(d.c/d.t*100);return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:38px;font-size:12px;color:var(--text-muted)">P${p}</span><div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:${pc}%;height:100%;background:${pc>=60?'var(--enchanted)':'var(--ember)'}"></div></div><span style="width:44px;text-align:right;font-size:12px;font-weight:700">${d.c}/${d.t}</span></div>`}).join('');
  const el=document.getElementById('screen-review');
  el.innerHTML=`${sparkHeroHTML(passed?'win':(acc>=0.6?'hello':'cheer'))}
    <div class="card result-card">
      ${timeUp?'<div class="q-ctx" style="color:var(--ember);margin-bottom:8px">時間切れ！未回答は不正解として採点しました。</div>':''}
      <div style="font-size:11px;color:var(--text-muted);letter-spacing:.08em;font-weight:700">推定 TOEIC スコア（目安）</div>
      <div class="result-score" style="color:var(--gold)">${est}</div>
      <div class="result-msg">正答 ${correct}/${items.length}（${Math.round(acc*100)}%）${diff!=null?` · 前回比 <span style="color:${diff>=0?'var(--enchanted)':'var(--ember)'};font-weight:700">${diff>=0?'+':''}${diff}</span>`:''}<br>${passed?`目標 ${target} 点を突破！この調子です。`:`目標 ${target} まであと ${target-est} 点。弱いパートを重点練習しよう。`}</div>
      <div style="text-align:left;margin:16px 0 8px;font-weight:700;font-size:var(--text-sm)">パート別正答率</div>
      ${partRows}
      <button class="btn btn-gold btn-block" style="margin-top:16px" onclick="startMock()">もう一度 ${ICONS.arrowRight}</button>
      <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="go('profile')">スコア推移を見る</button>
      <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="go('toeic')">TOEIC トップへ</button>
    </div>`;
  mockState=null;
}

let redState=null;
function openReduction(){
  const items=REDUCTIONS.map(x=>{const s=shuffleChoices(x.choices,x.correct);return{...x,choices:s.choices,correct:s.correctIndex}}).sort(()=>Math.random()-0.5).slice(0,12);
  redState={items,i:0,score:0};
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-review').classList.add('active');
  window.scrollTo(0,0);renderReductionStep();
  anim('#screen-review',{opacity:0,y:12},{opacity:1,y:0,duration:0.35,ease:'power2.out'});
  setTimeout(()=>speak(redState.items[0].natural),350);
}
function renderReductionStep(){
  const el=document.getElementById('screen-review');
  const {items,i}=redState;
  if(i>=items.length)return renderReductionResult();
  const q=items[i];
  el.innerHTML=`
    <div class="back-row"><button class="icon-btn" onclick="openScenarioList()" aria-label="戻る">${ICONS.arrowLeft}</button><h2>音声変化リスニング</h2></div>
    <div class="q-prog"><div class="q-prog-fill" style="width:${i/items.length*100}%"></div></div>

    <div style="text-align:center;margin:14px 0 6px">
      <button class="btn btn-gold" id="rd-play" style="padding:14px 28px;font-size:var(--text-md)">${ICONS.play} 音声を聞く</button>
      <div style="font-size:11px;color:var(--text-muted);margin-top:8px">崩れた音を聞いて、元の正しい文を選ぼう</div>
    </div>
    <div id="td-choices">${q.choices.map((c,idx)=>`<button class="choice-btn" data-rdi="${idx}">${esc(c)}</button>`).join('')}</div>
    <div class="q-toeic" id="td-exp"></div>
    <div id="td-next"></div>`;
  document.getElementById('rd-play').onclick=()=>{speak(q.natural);sfx('tap')};
  el.querySelectorAll('[data-rdi]').forEach(b=>b.onclick=()=>answerReduction(+b.dataset.rdi));
}
function answerReduction(idx){
  const q=redState.items[redState.i];
  const btns=document.querySelectorAll('#td-choices .choice-btn');
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('q-perfect');else if(i===idx)b.classList.add('q-ng')});
  const ok=idx===q.correct;sfx(ok?'correct':'wrong');comboHit(ok);
  if(ok)redState.score++;
  const rec=PROG.phrases[q.id]||(PROG.phrases[q.id]=newPhraseRec());
  rec.views++;if(ok){rec.correct++;srsGrade(rec,2)}else{rec.incorrect++;srsGrade(rec,0)}commit();
  const ex=document.getElementById('td-exp');
  ex.innerHTML=`<div style="margin-bottom:6px"><span style="color:var(--gold);font-weight:700">崩れた音：</span>「${esc(q.natural)}」</div><div style="margin-bottom:6px"><span style="color:var(--enchanted);font-weight:700">意味：</span>${esc(q.ja)}</div><strong>${esc(q.tip)}</strong>`;
  ex.style.display='block';
  document.getElementById('td-next').innerHTML=`<button class="btn btn-secondary btn-block" id="rd-again" style="margin-top:12px">${ICONS.play} もう一度聞く</button><button class="btn btn-primary btn-block" id="tdn" style="margin-top:8px">${redState.i+1>=redState.items.length?'Result':'Next'} ${ICONS.arrowRight}</button>`;
  document.getElementById('rd-again').onclick=()=>speak(q.natural);
  document.getElementById('tdn').onclick=()=>{redState.i++;renderReductionStep();if(redState.i<redState.items.length)setTimeout(()=>speak(redState.items[redState.i].natural),300)};
}
function renderReductionResult(){
  const {score,items}=redState;

  document.getElementById('screen-review').innerHTML=`${sparkHeroHTML(perfect?'win':(score>=items.length*0.6?'hello':'cheer'))}
    <div class="card result-card">

function weekXPData(){
  const out=[];const daily=PROG.xpDaily||{};
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10);out.push({key,day:['日','月','火','水','木','金','土'][d.getDay()],xp:daily[key]||0})}
  return out;
}
function heatmapHTML(){
  // 直近約16週(112日)の学習量ヒートマップ
  const daily=PROG.xpDaily||{};
  const weeks=16;const days=weeks*7;
  const today=new Date();
  // 今週の土曜まで埋めるオフセット
  const end=new Date(today);end.setDate(end.getDate()+(6-today.getDay()));
  const cells=[];let studyDays=0,maxXP=1;
  for(let i=days-1;i>=0;i--){const d=new Date(end);d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10);const xp=daily[key]||0;if(xp>0)studyDays++;if(xp>maxXP)maxXP=xp;cells.push({key,xp,future:d>today})}
  const level=xp=>xp<=0?0:xp<30?1:xp<80?2:xp<150?3:4;
  const cols=['rgba(255,255,255,.06)','rgba(245,200,76,.28)','rgba(245,200,76,.5)','rgba(245,200,76,.75)','var(--gold)'];
  // 列(週)ごとに縦7セル
  let grid='';
  for(let w=0;w<weeks;w++){grid+='<div class="hm-col">';for(let dow=0;dow<7;dow++){const c=cells[w*7+dow];const lv=c.future?0:level(c.xp);grid+=`<div class="hm-cell" style="background:${c.future?'transparent':cols[lv]}" title="${c.key}: ${c.xp} XP"></div>`}grid+='</div>'}
  const totalStudy=Object.values(daily).filter(x=>x>0).length;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <div style="font-weight:700">学習カレンダー</div>

    </div>
    <div style="overflow-x:auto;padding-bottom:2px"><div class="hm-grid">${grid}</div></div>
    <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:8px;font-size:10px;color:var(--text-muted)">
      少 ${cols.map(c=>`<span style="width:11px;height:11px;border-radius:3px;background:${c};display:inline-block"></span>`).join('')} 多
    </div>

  </div>`;
}

function weaknessReport(){
  const idx=buildCategoryIndex();
  const agg={};
  Object.keys(PROG.phrases).forEach(id=>{
    const meta=idx[id];if(!meta)return;
    const r=PROG.phrases[id];
    const attempts=(r.correct||0)+(r.incorrect||0);
    if(attempts<1)return;
    const g=agg[meta.key]||(agg[meta.key]={label:meta.label,action:meta.action,correct:0,attempts:0});
    g.correct+=r.correct||0;g.attempts+=attempts;
  });
  const rows=Object.values(agg).filter(g=>g.attempts>=3).map(g=>({...g,acc:g.correct/g.attempts}));
  rows.sort((a,b)=>a.acc-b.acc);
  return rows;
}

function shuffleChoices(choices,correctIndex){
  const pairs=choices.map((text,i)=>({text,isCorrect:i===correctIndex}));

/* ========== TTS: 声の選択と話者分け ==========
   OSのデフォルト音声はロボット的/非ネイティブ訛りのことが多いため、
   利用可能な音声から自然なen-US音声を優先的に選ぶ。男女の声を分けて
   Part3/4の会話（W:/M:）を聞き分けやすくする。 */
let _voices=[],_voicesReady=false;
function loadVoices(){
  if(!('speechSynthesis'in window))return;
  _voices=speechSynthesis.getVoices()||[];
  if(_voices.length)_voicesReady=true;
}
if('speechSynthesis'in window){
  loadVoices();

function pickVoice(pref,targetLang){
  // pref: 'female' | 'male' | undefined(お任せ)
  // targetLang: 'en-GB'/'en-AU'/'en-SG'等を指定すると、その地域アクセントの声を優先(端末に無ければen-USへ自動フォールバック)
  if(!_voices.length)loadVoices();
  const en=_voices.filter(v=>/^en(-|_)?(US|GB|AU|IN|SG)?/i.test(v.lang));
  const pool=en.length?en:_voices;
  if(!pool.length)return null;
  const femaleHints=/female|samantha|zira|jenny|aria|susan|karen|moira|tessa|victoria|google us english/i;
  const maleHints=/male|david|guy|mark|daniel|alex|fred|tom/i;
  const natural=/natural|online|neural/i;
  const score=v=>{
    let s=0;
    if(natural.test(v.name))s+=5;
    if(targetLang&&v.lang&&v.lang.toLowerCase()===targetLang.toLowerCase())s+=6;
    else if(!targetLang&&/en-US/i.test(v.lang))s+=3;
    if(pref==='female'&&femaleHints.test(v.name))s+=4;
    if(pref==='male'&&maleHints.test(v.name))s+=4;
    if(v.localService)s+=1;
    return s;
  };
  return pool.slice().sort((a,b)=>score(b)-score(a))[0]||pool[0];
}
function listenRate(base){return (base||0.92)*(PROG.listenSpeed||1)}
function speak(t,rate,pref,lang){
  if(!('speechSynthesis'in window))return;
  const u=new SpeechSynthesisUtterance(t);u.lang=lang||'en-US';u.rate=listenRate(rate);
  const v=pickVoice(pref,lang);if(v)u.voice=v;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function speakQueue(t,rate,pref,lang){
  // cancel せずキューに追加（会話を連続再生するため）
  if(!('speechSynthesis'in window))return;
  const u=new SpeechSynthesisUtterance(t);u.lang=lang||'en-US';u.rate=listenRate(rate);
  const v=pickVoice(pref,lang);if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function cycleListenSpeed(){
  const speeds=[1,0.75,1.25];
  const cur=PROG.listenSpeed||1;
  const next=speeds[(speeds.indexOf(cur)+1)%speeds.length]||1;
  PROG.listenSpeed=next;commit();

}

function startAudioSession(sourceId){
  const q=buildAudioQueue(sourceId);
  if(!q.length)return showToast('再生できる項目がありません');
  audioPlayer={queue:q,idx:0,playing:true,rate:0.9,repeat:true,sourceId};

function audioPlayCurrent(){
  if(!audioPlayer||!audioPlayer.playing)return;
  if(!('speechSynthesis'in window)){showToast('この端末は音声再生に対応していません');return}
  const it=audioPlayer.queue[audioPlayer.idx];
  if(!it)return;
  renderAudioNowPlaying();
  setAudioMediaSession(it);
  speechSynthesis.cancel();
  const u1=new SpeechSynthesisUtterance(it.en);u1.lang='en-US';u1.rate=audioPlayer.rate;
  const ev=pickVoice();if(ev)u1.voice=ev;
  u1.onend=()=>{
    if(!audioPlayer||!audioPlayer.playing)return;
    setTimeout(()=>{
      if(!audioPlayer||!audioPlayer.playing)return;
      const jv=pickJaVoice();
      if(jv){
        const u2=new SpeechSynthesisUtterance(it.ja);u2.lang='ja-JP';u2.rate=1;u2.voice=jv;
        u2.onend=()=>{if(audioPlayer&&audioPlayer.playing)setTimeout(()=>{if(audioPlayer&&audioPlayer.playing)audioAdvance()},600)};
        speechSynthesis.speak(u2);
      }else{
        setTimeout(()=>{if(audioPlayer&&audioPlayer.playing)audioAdvance()},500);
      }
    },350);
  };
  speechSynthesis.speak(u1);
}
function audioAdvance(){
  if(!audioPlayer)return;
  audioPlayer.idx++;
  if(audioPlayer.idx>=audioPlayer.queue.length){
    if(audioPlayer.repeat){audioPlayer.idx=0}
    else{audioPlayer.playing=false;renderAudioNowPlaying();return}
  }
  audioPlayCurrent();
}
function audioTogglePlay(){
  if(!audioPlayer)return;
  audioPlayer.playing=!audioPlayer.playing;
  if(audioPlayer.playing){audioPlayCurrent()}else{speechSynthesis.cancel()}
  renderAudioNowPlaying();
}
function audioNext(){if(!audioPlayer)return;speechSynthesis.cancel();audioPlayer.idx=(audioPlayer.idx+1)%audioPlayer.queue.length;if(audioPlayer.playing)audioPlayCurrent();else renderAudioNowPlaying()}
function audioPrev(){if(!audioPlayer)return;speechSynthesis.cancel();audioPlayer.idx=(audioPlayer.idx-1+audioPlayer.queue.length)%audioPlayer.queue.length;if(audioPlayer.playing)audioPlayCurrent();else renderAudioNowPlaying()}
function audioCycleRate(){if(!audioPlayer)return;const speeds=[0.75,0.9,1,1.15];audioPlayer.rate=speeds[(speeds.indexOf(audioPlayer.rate)+1)%speeds.length]||0.9;if(audioPlayer.playing){speechSynthesis.cancel();audioPlayCurrent()}else renderAudioNowPlaying()}
function audioToggleRepeat(){if(!audioPlayer)return;audioPlayer.repeat=!audioPlayer.repeat;renderAudioNowPlaying()}

let convState=null;

function charVoicePref(ch){
  // 名前から性別を推定して音声を選び分け（会話中の一貫性のため）
  const female=/^(sarah|emma|olivia|sophia|maria|linda|karen|lisa|anna|amy|rachel|grace|julia|nina|kate|susan|clerk|hostess|attendant)/i;
  const n=(ch&&ch.name||'').toLowerCase();
  if(/officer|mr\.?|sir|david|john|mike|tom|chen|lee|james|robert/i.test(n)&&!female.test(n))return 'male';
  return 'female';
}
function startConv(cid){
  const sc=SCENARIOS[curScenario];
  const conv=sc.conversations.find(c=>c.id===cid);
  convState={conv,step:0,history:[],voiceMode:PROG.convVoiceMode||false,lastSpokenIdx:-1};
  renderConvStep();
}
function toggleConvVoice(){
  PROG.convVoiceMode=!convState.voiceMode;convState.voiceMode=PROG.convVoiceMode;commit();
  renderConvStep();
}
function renderConvStep(){
  const body=document.getElementById('detail-body');
  const {conv,step,history,voiceMode}=convState;
  const ch=SCENARIOS[curScenario].characters.find(c=>c.id===conv.character)||SCENARIOS[curScenario].characters[0];
  const vpref=charVoicePref(ch);
  let html=`<div class="back-row"><button class="icon-btn" onclick="renderDetail()" aria-label="会話一覧に戻る">${ICONS.arrowLeft}</button><h2>${conv.title}</h2>
    <button class="icon-btn ${voiceMode?'on':''}" id="conv-voice-toggle" aria-label="音声応答モード切替" title="音声で応答">${ICONS.mic}</button></div>`;
  if(voiceMode)html+=`<div class="q-ctx" style="margin-bottom:10px">音声モード：相手の英語を聞き、選んだ返答を声に出して練習します。</div>`;
  html+='<div class="chat">';
  history.forEach((h,idx)=>{
    if(h.type==='char')html+=`<div class="msg msg-char"><div class="bubble">${esc(h.en)}<button class="bubble-play" data-say="${esc(h.en)}" data-vp="${vpref}" aria-label="もう一度聞く">${ICONS.play}</button></div><div class="bubble-ja">${esc(h.ja)}</div></div>`;
    else html+=`<div class="msg msg-user"><div class="bubble">${esc(h.en)}${h.score!=null?`<span class="bubble-score" style="color:${h.score>=80?'var(--enchanted)':h.score>=60?'var(--gold)':'var(--ember)'}">${h.score}点</span>`:''}</div></div>`;
  });
  html+='</div>';
  const turn=conv.turns[step];
  if(turn&&turn.who==='char'){
    convState.history.push({type:'char',en:turn.en,ja:turn.ja});
    convState.step++;return renderConvStep();
  }
  if(turn&&turn.who==='user'){
    html+='<div id="conv-choices">'+turn.choices.map((c,i)=>
      `<button class="choice-btn" data-ci="${i}">${esc(c.en)}<span class="cja">${esc(c.ja)}</span></button>`
    ).join('')+'</div>';
    body.innerHTML=html;
    body.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>pickChoice(+b.dataset.ci));
    body.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say,0.92,b.dataset.vp);sfx('tap')});
    const vt=document.getElementById('conv-voice-toggle');if(vt)vt.onclick=toggleConvVoice;
    anim('.chat .msg:last-child',{opacity:0,y:8},{opacity:1,y:0,duration:0.3});
    // 直近のキャラ発話を自動再生（一度だけ）
    const lastCharIdx=history.map(h=>h.type).lastIndexOf('char');
    if(lastCharIdx>convState.lastSpokenIdx){convState.lastSpokenIdx=lastCharIdx;const lc=history[lastCharIdx];if(lc)setTimeout(()=>speak(lc.en,0.92,vpref),350)}
  }else{
    html+=sparkHeroHTML('win')+`<div class="card result-card">
      <div class="result-score">Well done!</div>
      <div class="result-msg">${conv.title}を完了しました。実際の場面でも、今の落ち着いた受け答えができれば大丈夫です。</div>
      <button class="btn btn-gold btn-block" onclick="renderDetail()">Continue ${ICONS.arrowRight}</button></div>`;
    body.innerHTML=html;
    completeConv(conv.id);
  }
}
function pickChoice(i){
  const {conv,step,voiceMode}=convState;
  const turn=conv.turns[step];
  const choice=turn.choices[i];
  const box=document.getElementById('conv-choices');
  const btns=box.querySelectorAll('.choice-btn');
  btns.forEach((b,idx)=>{b.disabled=true;if(idx===i)b.classList.add('q-'+choice.q)});
  sfx(choice.q==='ng'?'wrong':'correct');
  if(!PREF_REDUCED&&window.gsap)gsap.fromTo(btns[i],{scale:1},{scale:1.03,duration:0.1,yoyo:true,repeat:1});
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const proceed=(score)=>{convState.history.push({type:'user',en:choice.en,score:score!=null?score:null});convState.step++;renderConvStep()};
  if(voiceMode&&SR){
    // 音声応答モード：選んだ返答を声に出す
    box.insertAdjacentHTML('afterend',`<div id="conv-fb">
      <div class="fb-box fb-${choice.q}">${esc(choice.fb)}</div>
      <div style="text-align:center;margin:10px 0 4px;font-size:12px;color:var(--text-secondary)">この返答を声に出してみよう</div>

/* ---- 自分の発音の録音・再生（MediaRecorder、SpeechRecognition非対応ブラウザでも利用可） ---- */
let shRecState=null;
function shToggleRecord(p){
  const msgEl=document.getElementById('sh-rec-msg');
  if(!navigator.mediaDevices||!window.MediaRecorder){
    if(msgEl)msgEl.textContent='このブラウザは録音に対応していません。';
    return;
  }
  if(shRecState&&shRecState.recording){shRecState.recorder.stop();return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const chunks=[];
    const recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
    recorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      if(shRecState&&shRecState.url)URL.revokeObjectURL(shRecState.url);
      shRecState={recording:false,url:URL.createObjectURL(blob)};
      renderShRecordControls(p);sfx('tap');
    };
    recorder.start();
    shRecState={recording:true,recorder,stream};
    renderShRecordControls(p);
  }).catch(()=>{if(msgEl)msgEl.textContent='マイクへのアクセスが許可されていません。設定を確認してください。'});
}
function renderShRecordControls(p){
  const slot=document.getElementById('sh-rec-slot');
  if(!slot)return;
  if(shRecState&&shRecState.recording){
    slot.innerHTML=`<button class="btn btn-gold mic-active" id="sh-rec-btn" aria-label="録音を停止">${ICONS.mic} 停止</button><div class="shadow-msg" id="sh-rec-msg" style="width:100%;margin-top:2px">録音中... もう一度押すと停止します</div>`;
  }else if(shRecState&&shRecState.url){
    slot.innerHTML=`<button class="btn btn-secondary" id="sh-rec-play" aria-label="自分の録音を聞く">${ICONS.play} 自分の発音を聞く</button><button class="btn btn-secondary" id="sh-rec-btn" aria-label="録音し直す">${ICONS.mic} 録音し直す</button><div class="shadow-msg" id="sh-rec-msg" style="width:100%;margin-top:2px"></div>`;
    document.getElementById('sh-rec-play').onclick=()=>new Audio(shRecState.url).play();
  }else{
    slot.innerHTML=`<button class="btn btn-secondary" id="sh-rec-btn" aria-label="自分の発音を録音">${ICONS.mic} 録音する</button><div class="shadow-msg" id="sh-rec-msg" style="width:100%;margin-top:2px">ネイティブ音声のあと、自分の発音を録音して聞き比べできます。</div>`;
  }
  const btn=document.getElementById('sh-rec-btn');
  if(btn)btn.onclick=()=>shToggleRecord(p);
}
function stopShRecording(){
  if(shRecState){
    if(shRecState.recording&&shRecState.recorder){try{shRecState.recorder.stop()}catch{}}
    if(shRecState.stream){shRecState.stream.getTracks().forEach(t=>t.stop())}
    if(shRecState.url){URL.revokeObjectURL(shRecState.url)}
  }
  shRecState=null;
}
function loopShadow(p){
  stopShLoop();let n=0;
  const msg=document.getElementById('sh-msg');
  (function run(){
    if(n>=3){if(msg)msg.textContent='Loop完了。Speakで採点してみましょう。';return}
    n++;if(msg)msg.textContent='Loop '+n+' / 3 — 影のように追いかけて！';
    speak(p.en,0.9);
    shLoop=setTimeout(run,Math.max(2200,p.en.length*90));
  })();
}
function scoreShadow(said,target){
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(Boolean);
  const said2=norm(said);const rawWords=target.split(/\s+/);
  const used=said2.slice();const marks=[];let hit=0;
  rawWords.forEach(rw=>{
    const key=rw.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!key){marks.push(true);return}
    const idx=used.indexOf(key);
    if(idx>=0){used.splice(idx,1);marks.push(true);hit++}else marks.push(false);
  });
  const denom=rawWords.filter(w=>w.replace(/[^a-z0-9]/gi,'')).length||1;
  return{score:Math.round(hit/denom*100),marks};
}
function drawRing(score){
  const ring=document.getElementById('sh-ring');if(!ring)return;
  const col=score>=90?'var(--enchanted)':score>=70?'var(--gold)':'var(--ember)';
  const c=2*Math.PI*52,off=c*(1-score/100);
  ring.style.display='block';
  ring.innerHTML=`<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="8"/><circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="sh-ring-num" style="color:${col}">${score}</div>`;
}
function recordShadow(p){
  stopShLoop();
  const btn=document.getElementById('sh-speak');
  const msg=document.getElementById('sh-msg');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){msg.textContent='お使いのブラウザは音声認識に対応していません。Chromeでお試しください。';return}
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;
  btn.classList.add('mic-active');msg.textContent='Listening... どうぞ話してください';
  addXP('shadowing_attempt');
  rec.onresult=e=>{
    const said=e.results[0][0].transcript;
    const {score,marks}=scoreShadow(said,p.en);
    document.querySelectorAll('#sh-target .sh-w').forEach((w,i)=>w.classList.add(marks[i]?'hit':'miss'));
    drawRing(score);
    const m=score>=90?'Excellent! ネイティブに近い発話です。':score>=70?'Good! 赤い単語を意識してもう一度。':'惜しい！赤い単語をLoopで重点練習しましょう。';
    msg.innerHTML=m+'<br><span style="color:var(--text-muted);font-size:var(--text-xs)">認識: '+esc(said)+'</span>';
    if(score>=90){addXP('shadowing_high_score');sfx('correct');launchConfetti()}else if(score>=70)sfx('correct');else sfx('wrong');
    srsAnswer(p.id,score>=70);
    if(!PREF_REDUCED&&window.gsap)gsap.fromTo('#sh-ring',{scale:0.6},{scale:1,duration:0.4,ease:'back.out(2)'});
  };
  rec.onerror=e=>{
    const em={'not-allowed':'Microphone access required. Please allow in browser settings.','no-speech':'No audio detected. Please try again.','network':'Network error. Please check your connection.'};
    msg.textContent=em[e.error]||('Error: '+e.error);
  };
  rec.onend=()=>btn.classList.remove('mic-active');
  try{rec.start()}catch{btn.classList.remove('mic-active')}
}

function launchConfetti(){
  if(PREF_REDUCED)return;
  const cv=document.getElementById('confetti');cv.style.display='block';
  cv.width=innerWidth;cv.height=innerHeight;const ctx=cv.getContext('2d');
  const cols=['#F5C84C','#534AB7','#1D9E75','#FF8A65','#AFA9EC','#fff'];
  const P=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],vx:(Math.random()-.5)*6,vy:Math.random()*4+2,rot:Math.random()*360,rv:(Math.random()-.5)*8,op:1}));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;p.op-=.008;p.vy+=.06;if(p.op<=0)return;ctx.save();ctx.globalAlpha=Math.max(0,p.op);ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
    if(++f<200)requestAnimationFrame(draw);else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display='none'}
  })();
}

/* ========== クリア動画の書き出し(サーバー不要・$0) ==========
   Canvas+MediaRecorderでアニメーションをその場で録画し、SNSシェア/保存できるようにする。
   有料LLM/API連携なしで実現できる範囲での「ゲームクリア動画」機能。 */
function pickVideoMime(){
  const cands=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  if(!window.MediaRecorder)return '';
  for(const m of cands){try{if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m}catch(e){}}
  return '';
}
function drawClearCardFrame(ctx,W,H,t,opts){
  // t: 0→1 の進行度
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#F5EAD8');g.addColorStop(0.55,'#F0A06B');g.addColorStop(1,'#C67139');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 装飾の星
  ctx.save();ctx.globalAlpha=0.5;
  const seed=[[0.15,0.12],[0.82,0.18],[0.1,0.42],[0.88,0.5],[0.2,0.85],[0.78,0.82]];
  seed.forEach((p,i)=>{
    const tw=(Math.sin(t*6.28*2+i)+1)/2;
    ctx.globalAlpha=0.25+tw*0.35;
    drawStar(ctx,p[0]*W,p[1]*H,10+tw*4,'#FFC6A5');
  });
  ctx.restore();
  const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
  // フェーズ1: Sparkマスコット(0〜0.3で拡大登場)
  const p1=ease(t/0.3);
  ctx.save();
  ctx.translate(W/2,H*0.32);
  ctx.scale(0.6+0.4*p1,0.6+0.4*p1);
  ctx.globalAlpha=p1;
  ctx.fillStyle='#8C491A';
  ctx.beginPath();ctx.ellipse(0,0,90,100,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFD6A6';
  drawStar(ctx,0,-118,22,'#FFD6A6');
  ctx.restore();
  // フェーズ2: タイトル(0.25〜0.55)
  const p2=ease((t-0.25)/0.3);
  if(p2>0){
    ctx.save();ctx.globalAlpha=p2;ctx.textAlign='center';
    ctx.fillStyle='#402310';
    ctx.font='700 40px Figtree, sans-serif';
    ctx.fillText(opts.title||'Training Complete!',W/2,H*0.5-(1-p2)*20);
    ctx.font='500 24px "Noto Sans JP", sans-serif';
    ctx.fillStyle='#5c3416';
    ctx.fillText(opts.subtitle||'',W/2,H*0.5+38-(1-p2)*20);
    ctx.restore();
  }
  // フェーズ3: XP/ストリーク数値(0.5〜0.8)
  const p3=ease((t-0.5)/0.3);
  if(p3>0){
    ctx.save();ctx.globalAlpha=p3;ctx.textAlign='center';
    const shown=Math.round((opts.xp||0)*Math.min(1,p3*1.3));
    ctx.font='800 56px Figtree, sans-serif';ctx.fillStyle='#FFD6A6';
    ctx.fillText('+'+shown+' XP',W/2,H*0.66);
    if(opts.streak){ctx.font='600 22px "Noto Sans JP", sans-serif';ctx.fillStyle='#402310';ctx.fillText('連続 '+opts.streak+' 日目',W/2,H*0.66+40)}
    ctx.restore();
    // 紙吹雪(0.55〜1.0)
    if(!drawClearCardFrame._P||drawClearCardFrame._seedT!==opts._seedT){
      drawClearCardFrame._seedT=opts._seedT;
      drawClearCardFrame._P=Array.from({length:50},()=>({x:Math.random()*W,y:-30-Math.random()*H*0.5,r:Math.random()*5+3,c:['#FFC6A5','#F6A06B','#AEBF92','#fff'][Math.random()*4|0],vy:Math.random()*3+2,rot:Math.random()*360,rv:(Math.random()-.5)*10}));
    }
    const conf=drawClearCardFrame._P;
    const ct=Math.max(0,(t-0.55)/0.45);
    conf.forEach(p=>{
      const y=p.y+p.vy*ct*140;const rot=p.rot+p.rv*ct*140;
      if(y>H+20)return;
      ctx.save();ctx.translate(p.x,y);ctx.rotate(rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();
    });
  }
  // フェーズ4: ロゴ(0.8〜1.0)
  const p4=ease((t-0.82)/0.18);
  if(p4>0){
    ctx.save();ctx.globalAlpha=p4;ctx.textAlign='center';
    ctx.font='700 30px Caprasimo, cursive';ctx.fillStyle='#402310';
    ctx.fillText('Sparkle',W/2,H*0.92);
    ctx.font='400 15px Figtree, sans-serif';ctx.fillStyle='#5c3416';
    ctx.fillText('English becomes your adventure.',W/2,H*0.92+22);
    ctx.restore();
  }
}
function drawStar(ctx,cx,cy,r,color){
  ctx.save();ctx.translate(cx,cy);ctx.fillStyle=color;ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1=(i*4*Math.PI)/5-Math.PI/2;
    ctx.lineTo(Math.cos(a1)*r,Math.sin(a1)*r);
    const a2=a1+2*Math.PI/5;
    ctx.lineTo(Math.cos(a2)*(r*0.42),Math.sin(a2)*(r*0.42));
  }
  ctx.closePath();ctx.fill();ctx.restore();
}
function generateClearVideoBlob(opts,durationMs,onProgress){
  return new Promise((resolve,reject)=>{
    try{
      const W=720,H=1280;
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;
      const ctx=cv.getContext('2d');
      const previewHost=document.getElementById('clear-video-canvas-host');
      if(previewHost){previewHost.innerHTML='';cv.style.width='100%';cv.style.borderRadius='16px';previewHost.appendChild(cv)}
      opts._seedT=Date.now();
      const mime=pickVideoMime();
      if(!('captureStream'in cv)||!window.MediaRecorder){reject(new Error('この端末/ブラウザは動画書き出しに対応していません'));return}
      const stream=cv.captureStream(30);
      const rec=new MediaRecorder(stream,mime?{mimeType:mime}:{});
      const chunks=[];
      rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      rec.onstop=()=>resolve({blob:new Blob(chunks,{type:mime||'video/webm'}),mime:mime||'video/webm'});
      rec.onerror=e=>reject(e.error||new Error('recording error'));
      rec.start();
      const start=performance.now();
      // requestAnimationFrameはタブが非表示になると完全停止するため、setTimeoutで駆動する
      // （バックグラウンドではブラウザが間引くが完全には止まらず、復帰時に必ず完了する）
      (function frame(){
        const t=(performance.now()-start)/durationMs;
        drawClearCardFrame(ctx,W,H,Math.min(1,t),opts);
        onProgress&&onProgress(Math.min(1,t));
        if(t<1)setTimeout(frame,33);
        else setTimeout(()=>rec.stop(),150);
      })();
    }catch(e){reject(e)}
  });
}

      actions.appendChild(dlBtn);
      if(navigator.share){
        const shareBtn=document.createElement('button');
        shareBtn.className='btn btn-primary btn-block';shareBtn.textContent='SNSでシェア';
        shareBtn.onclick=async()=>{
          try{
            const file=new File([blob],'sparkle-clear.'+ext,{type:mime});
            if(navigator.canShare&&!navigator.canShare({files:[file]})){window.open(url,'_blank');return}
            await navigator.share({files:[file],title:'Sparkle',text:opts.title||'Sparkleでの学習記録'});
          }catch(e){/* share cancelled */}
        };
        actions.appendChild(shareBtn);
      }
    }
  }).catch(e=>{
    const status=document.getElementById('cv-status');
    if(status)status.textContent='動画の作成に失敗しました：'+(e&&e.message?e.message:'不明なエラー');
  });
}
