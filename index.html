<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="English becomes your adventure. 通勤5分で世界を旅する英語学習アプリ。TOEIC 650対応。">

<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23402310'/><polygon points='32,18 38,32 52,33 41,42 44,56 32,49 20,56 23,42 12,33 26,32' fill='%23FFC6A5'/></svg>">

<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&family=Permanent+Marker&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
:root{
  /* Organic design system — warm cream/terracotta/sage palette (Claude Design import) */
  --night:#f5ead8;--deep:#dcd3c4;--sparkle:#c67139;--sparkle-2:#d67f48;--stardust:#728157;
  --gold:#643312;--ember:#8c491a;--enchanted:#56633f;
  --surface:#ebddc5;--surface-2:#f9f4ed;--surface-hover:#eee7db;
  --border:color-mix(in srgb,#201e1d 16%,transparent);--border-strong:color-mix(in srgb,#201e1d 28%,transparent);--border-active:#c67139;
  --text-primary:#201e1d;--text-secondary:color-mix(in srgb,#201e1d 66%,transparent);--text-muted:color-mix(in srgb,#201e1d 48%,transparent);
  --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);
  --font-heading:'Caprasimo','Noto Sans JP',system-ui,sans-serif;
  --font-body:'Figtree','Noto Sans JP',system-ui,sans-serif;
  --space-xs:.25rem;--space-sm:.5rem;--space-md:1rem;--space-lg:1.5rem;--space-xl:2rem;--space-2xl:3rem;
  --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;--text-3xl:2rem;
  --ease-out:cubic-bezier(0.16,1,0.3,1);--ease-in-out:cubic-bezier(0.87,0,0.13,1);
  --duration-fast:.15s;--duration-base:.3s;--duration-slow:.6s;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --night:#2e2b25;--deep:#474238;--sparkle:#d67f48;--sparkle-2:#f6a06b;--stardust:#8fa073;
    --gold:#ffc6a5;--ember:#f6a06b;--enchanted:#aebf92;
    --surface:rgba(249,244,237,0.06);--surface-2:rgba(249,244,237,0.10);--surface-hover:rgba(249,244,237,0.12);
    --border:rgba(249,244,237,0.12);--border-strong:rgba(249,244,237,0.20);--border-active:#d67f48;
    --text-primary:#f9f4ed;--text-secondary:rgba(249,244,237,0.68);--text-muted:rgba(249,244,237,0.46);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 3px 10px rgba(0,0,0,.35);
    --shadow-lg:0 12px 32px rgba(0,0,0,.45);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60% 40% at 15% 0%,color-mix(in srgb,var(--sparkle) 16%,transparent),transparent 60%),
    radial-gradient(50% 35% at 90% 8%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 60%),
    radial-gradient(60% 50% at 50% 100%,color-mix(in srgb,var(--enchanted) 10%,transparent),transparent 65%),
    linear-gradient(color-mix(in srgb,var(--night) 93%,transparent),color-mix(in srgb,var(--night) 93%,transparent)),
    url('sparkle_assets/onboarding_hero.jpg') center 15%/cover no-repeat;
  background-attachment:fixed;
  color:var(--text-primary);min-height:100vh;
  padding-bottom:calc(76px + var(--safe-b));
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;color:inherit;min-height:44px}
input,textarea{font-family:inherit}
svg{display:block;flex-shrink:0}
.hidden{display:none!important}

/* layout */
.wrap{max-width:560px;margin:0 auto;padding:var(--space-md)}
.screen{display:none}
.screen.active{display:block}

/* header */
.hdr{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:color-mix(in srgb,var(--night) 80%,transparent);
  border-bottom:1px solid var(--border);
}
.hdr-in{max-width:560px;margin:0 auto;padding:10px var(--space-md);display:flex;align-items:center;justify-content:space-between;min-height:56px}
.logo{font-family:var(--font-heading);font-size:var(--text-lg);font-weight:400;letter-spacing:-.01em}
.logo span{background:linear-gradient(90deg,var(--gold),var(--stardust),var(--gold));background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:logoShine 5s linear infinite}
@keyframes logoShine{0%{background-position:0 0}100%{background-position:200% 0}}
.hdr-stats{display:flex;gap:6px}
.hdr-pill{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;letter-spacing:.02em}
.hdr-pill svg{color:var(--gold);width:13px;height:13px}

/* cards */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:var(--space-md);margin-bottom:12px;box-shadow:var(--shadow-md);
  transition:border-color var(--duration-base) var(--ease-out),background var(--duration-base) var(--ease-out),transform var(--duration-fast) var(--ease-out),box-shadow var(--duration-base) var(--ease-out);
  position:relative;
}
.card:hover{border-color:var(--border-strong);background:var(--surface-hover)}
.card:active{transform:scale(.995)}
[role="button"].card{cursor:pointer}
[role="button"].card:hover{border-color:var(--border-active);box-shadow:var(--shadow-md),var(--shadow-lg)}
.glow-card{overflow:hidden}
.glow-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--sparkle) 22%,transparent),transparent 60%);
  transition:opacity var(--duration-base) var(--ease-out);
}
.glow-card:hover::before{opacity:1}

/* today focus card */
.focus-card{
  position:relative;overflow:hidden;border-radius:28px;margin-bottom:var(--space-lg);
  padding:var(--space-lg);
  background:linear-gradient(150deg,color-mix(in srgb,var(--sparkle) 28%,transparent),color-mix(in srgb,var(--sparkle-2) 10%,transparent) 55%,var(--surface));
  border:1px solid var(--border-strong);box-shadow:var(--shadow-md),var(--shadow-lg);
}
.focus-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.focus-greet{font-family:var(--font-heading);font-size:var(--text-xl);font-weight:400;letter-spacing:-.01em}
.focus-sub{font-size:var(--text-xs);color:var(--text-secondary);margin-top:3px;font-weight:500}
.focus-ring{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p,0)*1%),color-mix(in srgb,var(--text-primary) 12%,transparent) 0);
}
.focus-ring span{width:42px;height:42px;border-radius:50%;background:var(--night);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--gold)}
.focus-ring small{font-size:8px;font-weight:700}
.focus-next{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--text-primary) 6%,transparent);border:1px solid var(--border);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.focus-next-txt{flex:1;min-width:0}
.focus-next-title{font-weight:700;font-size:var(--text-sm)}
.focus-next-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}
.focus-mins{font-size:11px;font-weight:800;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:8px;padding:4px 8px;flex-shrink:0}
.focus-chips{display:flex;gap:8px;margin-top:14px}
.focus-chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);font-size:11px;font-weight:700;transition:background var(--duration-base),color var(--duration-base),transform var(--duration-fast)}
.focus-chip svg{width:19px;height:19px;color:var(--stardust)}
.focus-chip:hover{background:var(--surface-hover);color:var(--text-primary)}
.focus-chip:active{transform:scale(.95)}
.focus-weak{display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--ember) 14%,transparent);border:1px solid color-mix(in srgb,var(--ember) 30%,transparent);border-radius:16px;padding:9px 12px;margin-bottom:12px;cursor:pointer;font-size:12px;color:var(--text-primary)}
.focus-weak svg{width:15px;height:15px;color:var(--ember);flex-shrink:0}
.focus-weak-txt{flex:1;min-width:0}
.focus-weak b{color:var(--ember)}
.login-strip{display:flex;gap:5px;margin-top:12px}
.login-dot{flex:1;text-align:center;border-radius:13px;padding:6px 2px;background:color-mix(in srgb,#000 16%,transparent);border:1px solid var(--border)}
.login-dot-day{font-size:9px;color:var(--text-muted);font-weight:700}
.login-dot-xp{font-size:11px;font-weight:800;color:var(--text-secondary);margin-top:1px}
.login-dot.done{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.login-dot.done .login-dot-xp{color:var(--gold)}
.login-dot.cur{border-color:var(--gold);box-shadow:0 0 10px -2px color-mix(in srgb,var(--gold) 50%,transparent)}
.hm-grid{display:flex;gap:3px;min-width:max-content}
.hm-col{display:flex;flex-direction:column;gap:3px}
.hm-cell{width:11px;height:11px;border-radius:3px}
@media (prefers-color-scheme: dark){.focus-ring span{background:var(--night)}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);
  border:none;border-radius:999px;padding:12px 20px;
  font-family:var(--font-heading);font-size:var(--text-sm);font-weight:400;
  transition:filter var(--duration-base) var(--ease-out),transform var(--duration-fast) var(--ease-out);
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--sparkle),var(--sparkle-2));color:var(--night);box-shadow:0 6px 18px -6px color-mix(in srgb,var(--sparkle) 60%,transparent)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-primary)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-gold{background:linear-gradient(135deg,var(--sparkle-2),var(--gold));color:var(--night);box-shadow:0 6px 18px -6px color-mix(in srgb,var(--gold) 55%,transparent)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-block{display:flex;width:100%}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-secondary);
  transition:all var(--duration-base) var(--ease-out);
}
.icon-btn:hover{border-color:var(--border-active);color:var(--text-primary)}
.icon-btn.on{color:var(--gold);border-color:var(--gold)}

/* section titles */
.sec-title{font-family:var(--font-heading);font-size:var(--text-base);font-weight:400;margin:var(--space-lg) 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;color:var(--text-primary)}
.sec-title svg{color:var(--text-muted);width:18px;height:18px}
.sec-sub{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:var(--space-sm)}

/* bottom nav */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:color-mix(in srgb,var(--night) 92%,transparent);
  border-top:1px solid var(--border);
  border-radius:24px 24px 0 0;
  box-shadow:0 -2px 12px color-mix(in srgb,#000 10%,transparent);
  padding-bottom:var(--safe-b);
  display:flex;
}
.nav-btn{
  flex:1;background:none;border:none;padding:10px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-muted);font-size:11px;font-weight:600;letter-spacing:.02em;
  transition:color var(--duration-base) var(--ease-out);position:relative;
}
.nav-btn svg{width:22px;height:22px;transition:transform var(--duration-base) var(--ease-out)}
.nav-btn.on{color:var(--text-primary)}
.nav-btn.on svg{color:var(--gold);transform:translateY(-1px)}
.nav-btn.on::after{content:'';position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--gold);border-radius:0 0 3px 3px}

/* pills / badges */
.pill-row{display:flex;gap:var(--space-sm);overflow-x:auto;padding-bottom:var(--space-xs);margin-bottom:var(--space-md);scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill{
  border:1px solid var(--border);background:var(--surface);border-radius:999px;
  padding:8px 16px;font-size:var(--text-xs);font-weight:600;white-space:nowrap;
  color:var(--text-secondary);transition:all var(--duration-base) var(--ease-out);min-height:36px;
}
.pill.on{background:var(--sparkle);border-color:var(--sparkle);color:var(--night)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted)}
.tag-toeic{color:var(--stardust);border-color:var(--border-active)}
.tag-review{color:var(--gold);border-color:var(--gold)}
.diff-dots{display:inline-flex;gap:3px}
.diff-dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.diff-dot.on{background:var(--stardust)}

/* phrase card */
.phrase-card{cursor:pointer}
.phrase-card.due{border-left:3px solid var(--gold)}
.phrase-en{font-family:var(--font-heading);font-size:var(--text-lg);font-weight:400;line-height:1.4;margin-bottom:4px;padding-right:64px}
.phrase-ja{font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:2px}
.phrase-pron{font-size:var(--text-sm);color:var(--text-muted)}
.phrase-meta{position:absolute;top:var(--space-md);right:var(--space-md);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.phrase-foot{display:flex;justify-content:flex-end;gap:var(--space-sm);margin-top:var(--space-sm)}
.phrase-tip{
  display:none;margin-top:var(--space-sm);padding:var(--space-sm) var(--space-md);
  border-left:2px solid var(--stardust);background:var(--surface);
  border-radius:0 8px 8px 0;font-size:var(--text-sm);color:var(--text-secondary);line-height:1.6;
}
.phrase-card.open .phrase-tip{display:block}

/* chat */
.char-bar{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md);background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:var(--space-md)}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--text-lg);color:#fff;flex-shrink:0}
.char-name{font-weight:700;font-size:var(--text-base)}
.char-role{font-size:var(--text-xs);color:var(--text-muted)}
.chat{display:flex;flex-direction:column;gap:var(--space-md);margin-bottom:var(--space-md)}
.msg{max-width:88%}
.msg-char .bubble{background:var(--deep);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:var(--text-sm);line-height:1.5;position:relative;display:flex;align-items:flex-start;gap:8px}
.msg-char .bubble-ja{font-size:var(--text-xs);color:var(--text-muted);margin-top:6px;padding:0 4px}
.bubble-play{flex-shrink:0;width:28px;height:28px;min-height:28px;border-radius:999px;border:1px solid var(--border);background:color-mix(in srgb,var(--text-primary) 6%,transparent);color:var(--stardust);display:inline-flex;align-items:center;justify-content:center;margin-top:-1px}
.bubble-play svg{width:14px;height:14px}
.bubble-play:hover{color:var(--text-primary);border-color:var(--border-strong)}
.msg-user{align-self:flex-end}
.msg-user .bubble{background:var(--sparkle);color:var(--night);border-radius:18px 18px 4px 18px;padding:12px 16px;font-size:var(--text-sm);line-height:1.5;display:flex;align-items:center;gap:8px}
.bubble-score{font-size:11px;font-weight:800;background:color-mix(in srgb,var(--night) 18%,transparent);border-radius:8px;padding:2px 7px;flex-shrink:0}
.choice-btn{
  display:block;position:relative;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--border);border-radius:18px;padding:14px 18px 14px 50px;
  margin-bottom:var(--space-sm);font-size:var(--text-sm);font-weight:500;line-height:1.5;
  transition:all var(--duration-base) var(--ease-out);counter-increment:opt;
}
.choice-btn::before{
  content:counter(opt,upper-alpha);position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:999px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--text-secondary);
}
.choice-btn:hover:not(:disabled){border-color:var(--border-active);background:var(--surface-hover)}
.choice-btn .cja{display:block;font-size:var(--text-xs);color:var(--text-muted);margin-top:4px;font-weight:400}
.choice-btn.q-perfect{border-color:var(--enchanted);background:color-mix(in srgb,var(--enchanted) 12%,transparent);color:var(--enchanted)}
.choice-btn.q-perfect::before{background:var(--enchanted);color:var(--night)}
.choice-btn.q-ok{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.choice-btn.q-ok::before{background:var(--gold);color:var(--night)}
.choice-btn.q-ng{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 10%,transparent);color:var(--ember)}
.choice-btn.q-ng::before{background:var(--ember);color:var(--night)}
#td-choices,#conv-choices,#j-choices,#story-choices,#q-choices{counter-reset:opt}
.fb-box{border-radius:16px;padding:var(--space-md);font-size:var(--text-sm);line-height:1.6;margin-bottom:var(--space-sm);border:1px solid var(--border);background:var(--surface)}
.fb-box.fb-perfect{border-color:var(--enchanted)}
.fb-box.fb-ok{border-color:var(--gold)}
.fb-box.fb-ng{border-color:var(--ember)}

/* quiz */
.q-prog{height:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-bottom:var(--space-lg)}
.q-prog-fill{height:100%;background:linear-gradient(90deg,var(--sparkle),var(--gold));transition:width var(--duration-slow) var(--ease-out)}
.q-ctx{font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:var(--space-sm);line-height:1.6}
.q-text{font-family:var(--font-heading);font-size:var(--text-lg);font-weight:400;margin-bottom:var(--space-lg);line-height:1.5}
.q-toeic{display:none;font-size:var(--text-sm);color:var(--stardust);line-height:1.6;margin:var(--space-sm) 0;padding:var(--space-sm) var(--space-md);border-left:2px solid var(--stardust);background:var(--surface);border-radius:0 8px 8px 0}

/* progress bars */
.prog{height:6px;background:var(--surface);border-radius:999px;overflow:hidden;margin-top:var(--space-sm)}
.prog-fill{height:100%;background:var(--gold);border-radius:999px;transition:width var(--duration-slow) var(--ease-out)}

/* scenario grid */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc-card{cursor:pointer;padding:16px 14px}
.sc-card::after{content:'';position:absolute;top:0;left:12px;right:12px;height:2px;border-radius:0 0 3px 3px;background:var(--sc-color,var(--sparkle));opacity:.75}
.sc-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:color-mix(in srgb,var(--sc-color,var(--sparkle)) 16%,transparent);color:var(--sc-color,var(--sparkle))}
.sc-title{font-family:var(--font-heading);font-weight:400;font-size:var(--text-base);letter-spacing:-.01em}
.sc-ja{font-size:11px;color:var(--text-muted);margin-bottom:10px}
.sc-count{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:600}

/* detail tabs */
.dtabs{display:flex;gap:var(--space-xs);margin-bottom:var(--space-md);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px}
.dtab{flex:1;border:none;background:none;border-radius:999px;padding:9px 4px;font-size:var(--text-xs);font-weight:600;color:var(--text-muted);transition:all var(--duration-base) var(--ease-out);min-height:40px}
.dtab.on{background:var(--sparkle);color:var(--night)}

/* profile */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}
.stat-card{text-align:center;padding:var(--space-lg) var(--space-md)}
.stat-card svg{margin:0 auto var(--space-sm);color:var(--gold)}
.stat-val{font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:400}
.stat-lbl{font-size:var(--text-xs);color:var(--text-muted);font-weight:600;margin-top:2px}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-sm)}
.badge-cell{text-align:center;padding:var(--space-md) var(--space-xs);cursor:pointer}
.badge-cell svg{margin:0 auto var(--space-sm);color:var(--gold)}
.badge-cell.locked{opacity:.4}
.badge-cell.locked svg{color:var(--text-muted)}
.badge-name{font-size:var(--text-xs);font-weight:600}
.badge-cond{display:none;font-size:var(--text-xs);color:var(--text-muted);margin-top:4px}
.badge-cell.show-tip .badge-cond{display:block}
.locked-card{opacity:.5}
.locked-card .lk{display:flex;align-items:center;gap:var(--space-sm);font-weight:600;font-size:var(--text-sm)}
.locked-card .lk-sub{font-size:var(--text-xs);color:var(--text-muted);margin-top:4px}

/* mission card */
.mission-card{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 6%,transparent) 0%,var(--surface) 100%);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);position:relative;overflow:hidden}
.mission-card::before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 15%,transparent),transparent 65%);pointer-events:none}
.mission-card>*{position:relative;z-index:1}
.mission-mode{font-family:var(--font-heading);font-size:var(--text-xl);font-weight:400;margin:var(--space-xs) 0;letter-spacing:-.01em}
.mission-meta{display:flex;align-items:center;gap:var(--space-md);margin-bottom:var(--space-md);font-size:var(--text-xs);color:var(--text-muted)}
.mission-meta span{display:flex;align-items:center;gap:4px}
.spark-message{font-style:italic;color:var(--stardust);font-size:var(--text-sm);line-height:1.7;padding:var(--space-md)}
.spark-message .ja{display:block;font-style:normal;color:var(--text-muted);font-size:var(--text-xs);margin-top:var(--space-xs)}

/* shadowing */
.shadow-phrase{font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:400;line-height:1.4;text-align:center;margin:var(--space-xl) 0 var(--space-sm)}
.shadow-pron{text-align:center;color:var(--text-muted);font-size:var(--text-sm);margin-bottom:var(--space-xl)}
.shadow-ctrl{display:flex;gap:var(--space-sm);justify-content:center;margin-bottom:var(--space-lg)}
.shadow-score{text-align:center;font-size:var(--text-3xl);font-weight:700;margin:var(--space-md) 0}
.shadow-msg{text-align:center;font-size:var(--text-sm);color:var(--text-secondary);line-height:1.6;min-height:44px}
.mic-active{background:var(--ember)!important;border-color:var(--ember)!important;color:var(--night)!important;animation:micpulse 1s ease-in-out infinite}
.sh-words{text-align:center;font-size:var(--text-xl);font-weight:600;line-height:1.7;margin:var(--space-md) 0}
.sh-w{padding:1px 3px;border-radius:4px;transition:background var(--duration-base)}
.sh-w.hit{color:var(--enchanted)}
.sh-w.miss{color:var(--ember);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
.sh-ring{width:120px;height:120px;margin:0 auto var(--space-sm);position:relative}
.sh-ring svg{transform:rotate(-90deg)}
.sh-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--text-3xl);font-weight:700}
.sh-tabs{display:flex;gap:var(--space-xs);justify-content:center;margin-bottom:var(--space-md)}
.sh-hint{text-align:center;font-size:var(--text-xs);color:var(--text-muted);margin-bottom:var(--space-lg);line-height:1.6}
/* review deck */
.rv-top{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-md)}
.rv-prog{flex:1;height:6px;background:var(--surface);border-radius:999px;overflow:hidden}
.rv-prog-fill{height:100%;background:linear-gradient(90deg,var(--sparkle),var(--gold));transition:width var(--duration-base) var(--ease-out)}
.rv-flip{perspective:1200px;margin:var(--space-md) 0;cursor:pointer;min-height:240px}
.rv-inner{position:relative;width:100%;min-height:240px;transition:transform var(--duration-slow) var(--ease-in-out);transform-style:preserve-3d}
.rv-flip.flipped .rv-inner{transform:rotateY(180deg)}
.rv-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--border);padding:var(--space-xl) var(--space-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--surface)}
.rv-back{transform:rotateY(180deg);background:var(--deep)}
.rv-en{font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:400;line-height:1.4}
.rv-scene{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-md)}
.rv-ja{font-size:var(--text-lg);font-weight:600;margin-bottom:var(--space-sm)}
.rv-pron{font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:var(--space-md)}
.rv-hint{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-md)}
.rv-actions{display:flex;gap:var(--space-sm)}
.rv-actions .btn{flex:1}
/* dictation */
.dt-play{display:flex;justify-content:center;gap:var(--space-sm);margin:var(--space-lg) 0}
.dt-play .btn{min-width:120px}
.dt-input{width:100%;min-height:96px;padding:var(--space-md);background:var(--surface);border:1px solid var(--border);border-radius:18px;color:var(--text-primary);font-size:var(--text-base);font-family:inherit;resize:vertical;outline:none;line-height:1.6}
.dt-input:focus{border-color:var(--sparkle);box-shadow:0 0 0 3px color-mix(in srgb,var(--sparkle) 15%,transparent)}
.dt-diff{margin-top:var(--space-md);padding:var(--space-md);background:var(--surface);border:1px solid var(--border);border-radius:18px;font-size:var(--text-base);line-height:1.9}
.dt-w-hit{color:var(--enchanted);font-weight:600}
.dt-w-miss{color:var(--ember);font-weight:600;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
.dt-w-extra{color:var(--text-muted);text-decoration:line-through}
/* spark companion */
.spark-hero{position:relative;padding:var(--space-lg) var(--space-md);text-align:center;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--sparkle) 22%,transparent),color-mix(in srgb,var(--stardust) 8%,transparent) 60%,transparent);border-radius:26px;border:1px solid var(--border-active);margin-bottom:var(--space-md)}
.spark-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 45%),radial-gradient(circle at 80% 70%,color-mix(in srgb,var(--stardust) 14%,transparent),transparent 40%);pointer-events:none}
.spark-img{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 8px 20px color-mix(in srgb,var(--sparkle) 35%,transparent));position:relative;z-index:1;animation:sparkBob 3.4s ease-in-out infinite}
@keyframes sparkBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.spark-fallback{width:140px;height:140px;margin:0 auto;position:relative}
.spark-fallback svg{width:100%;height:100%}
.spark-line{font-size:var(--text-base);font-weight:600;margin-top:var(--space-sm);color:var(--text-primary);position:relative;z-index:1}
.spark-line .ja{display:block;font-size:var(--text-xs);color:var(--text-secondary);font-weight:400;margin-top:4px;font-style:italic}
.spark-lv{position:absolute;top:12px;right:12px;background:var(--gold);color:var(--night);font-weight:700;font-size:var(--text-xs);padding:4px 10px;border-radius:999px;z-index:2}
.spark-xp{position:absolute;bottom:12px;left:12px;right:12px;height:5px;background:color-mix(in srgb,#000 25%,transparent);border-radius:999px;overflow:hidden;z-index:2}
.spark-xp-fill{height:100%;background:linear-gradient(90deg,var(--sparkle),var(--gold));transition:width var(--duration-slow) var(--ease-out)}
.spark-bubble{display:inline-block;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border);border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:600;font-size:var(--text-sm);box-shadow:var(--shadow-sm);margin-top:var(--space-sm);position:relative;z-index:1}
/* fixed always-dark hero blocks — pin light text/accent regardless of system theme,
   since these keep a literal dark gradient bg in both light and dark mode */
.postcard,.toeic-hero,.wdw-hero,.passport{
  --gold:#FFD6A6;--stardust:#C9D6B4;--enchanted:#AEBF92;--sparkle:#F0A06B;--sparkle-2:#FFC6A5;--ember:#F6A06B;
  --text-primary:#FFF8EF;--text-secondary:rgba(255,248,239,.75);--text-muted:rgba(255,248,239,.55);
  --night:#241D14;
}
/* travel postcard */
.postcard{position:relative;border-radius:26px;overflow:hidden;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--stardust) 30%,transparent);background:linear-gradient(170deg,#402310 0%,#643312 45%,#8c491a 100%);min-height:270px;box-shadow:0 12px 40px -12px color-mix(in srgb,var(--sparkle) 55%,transparent),0 0 0 1px rgba(255,255,255,.02) inset}
.postcard-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(245,200,76,.28),transparent 45%),radial-gradient(ellipse at 80% 50%,rgba(175,169,236,.18),transparent 50%)}
.postcard-city{position:absolute;left:0;right:0;bottom:0;opacity:.9;pointer-events:none}
.postcard-city svg{width:100%;height:auto;display:block}
.postcard-plane{position:absolute;top:16%;left:-8%;width:120%;pointer-events:none;opacity:.55}
.postcard-plane svg{width:100%;height:auto}
.postcard-top{position:relative;padding:var(--space-lg) var(--space-md) 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.postcard-loc{font-size:var(--text-xs);color:var(--stardust);font-weight:600;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.postcard-place{font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:400;color:#fff;letter-spacing:-.01em;line-height:1.1}
.postcard-ja{font-size:var(--text-sm);color:rgba(255,255,255,.7);margin-top:4px}
.postcard-stamp{background:rgba(255,255,255,.08);border:1px dashed rgba(255,214,166,.6);border-radius:8px;padding:6px 10px;font-size:var(--text-xs);font-weight:700;color:#FFD6A6;text-transform:uppercase;letter-spacing:.1em;transform:rotate(-6deg);text-align:center;line-height:1.2}
.postcard-body{position:relative;z-index:2;padding:var(--space-md);text-align:center}
.postcard-spark{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4));position:relative;z-index:2;animation:sparkBob 3.4s ease-in-out infinite}
.pass-stamp{position:absolute;top:8px;right:8px;background:color-mix(in srgb,var(--enchanted) 15%,transparent);border:1.5px dashed var(--enchanted);color:var(--enchanted);font-size:9px;font-weight:800;text-transform:uppercase;padding:3px 6px;border-radius:6px;transform:rotate(8deg);letter-spacing:.08em;line-height:1;z-index:3}
@keyframes planeTrail{0%{stroke-dashoffset:400}100%{stroke-dashoffset:0}}
.postcard-plane path.trail{stroke-dasharray:6 8;animation:planeTrail 6s linear infinite}
/* city stories */
.story-card{position:relative;overflow:hidden;padding:var(--space-md);cursor:pointer}
.story-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sty-color,var(--sparkle))}
.story-loc{font-size:var(--text-xs);color:var(--stardust);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.story-title{font-family:var(--font-heading);font-size:var(--text-base);font-weight:400;line-height:1.35;margin-bottom:2px}
.story-ja{font-size:var(--text-xs);color:var(--text-secondary);margin-bottom:8px}
.story-meta{display:flex;align-items:center;gap:var(--space-sm);font-size:var(--text-xs);color:var(--text-muted)}
.story-meta .avatar{width:20px;height:20px;font-size:10px}
.story-done{position:absolute;top:8px;right:8px;background:color-mix(in srgb,var(--enchanted) 15%,transparent);border:1.5px dashed var(--enchanted);color:var(--enchanted);font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;transform:rotate(6deg);letter-spacing:.06em}
/* passport */
.passport{background:linear-gradient(180deg,#402310 0%,#54280d 100%);border:1px solid var(--border-active);border-radius:22px;padding:var(--space-md);margin-bottom:var(--space-sm);position:relative;overflow:hidden}
.passport::before{content:'';position:absolute;top:0;left:0;right:0;height:80px;background:radial-gradient(ellipse at 50% 0%,rgba(245,200,76,.15),transparent 65%);pointer-events:none}
.passport-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-sm)}
.passport-title{font-family:var(--font-heading);font-weight:400;font-size:var(--text-base);display:flex;align-items:center;gap:6px}
.passport-code{font-size:var(--text-xs);color:var(--gold);font-weight:800;letter-spacing:.15em;padding:2px 8px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:6px}
.passport-stories{display:flex;gap:var(--space-sm)}
.pp-slot{flex:1;position:relative;height:74px;border-radius:14px;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.1);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6px;transition:all var(--duration-base) var(--ease-out);cursor:pointer}
.pp-slot:hover{border-color:var(--border-active)}
.pp-slot.stamped{border-style:solid;border-color:var(--enchanted);background:color-mix(in srgb,var(--enchanted) 8%,transparent)}
.pp-slot.stamped::after{content:'';position:absolute;inset:6px;border:2px dashed var(--enchanted);border-radius:8px;opacity:.35;transform:rotate(-4deg);pointer-events:none}
.pp-title{font-size:10px;font-weight:700;line-height:1.2;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em}
.pp-slot.stamped .pp-title{color:var(--enchanted)}
.pp-lock{color:var(--text-muted);opacity:.5}
.passport-progress{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-sm)}
/* toeic focus */
.toeic-hero{background:linear-gradient(160deg,#402310 0%,#643312 60%,#8c491a 100%);border:1px solid var(--border-active);border-radius:26px;padding:var(--space-lg) var(--space-md);margin-bottom:var(--space-md);position:relative;overflow:hidden}
.toeic-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(245,200,76,.2),transparent 60%);pointer-events:none}
.toeic-badge{display:inline-block;background:var(--gold);color:var(--night);font-weight:800;font-size:var(--text-xs);padding:3px 10px;border-radius:999px;letter-spacing:.08em;margin-bottom:8px}
.toeic-target{font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:400;line-height:1.2;margin-bottom:6px}
.toeic-desc{font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:var(--space-md);line-height:1.5}
.toeic-meter{background:rgba(255,255,255,.08);border-radius:18px;padding:var(--space-md);margin-bottom:var(--space-md);position:relative;z-index:1}
.toeic-meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.toeic-score{font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:400;color:var(--gold);letter-spacing:-.01em}
.toeic-target-num{font-size:var(--text-xs);color:var(--text-muted)}
.toeic-bar{height:10px;background:rgba(0,0,0,.3);border-radius:999px;overflow:hidden;position:relative}
.toeic-bar-fill{height:100%;background:linear-gradient(90deg,var(--sparkle) 0%,var(--gold) 100%);border-radius:999px;transition:width var(--duration-slow) var(--ease-out)}
.toeic-bar-goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.toeic-parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.toeic-part{background:rgba(255,255,255,.06);border-radius:16px;padding:10px 6px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:all var(--duration-base)}
.toeic-part:hover{border-color:var(--border-active);background:rgba(255,255,255,.1)}
.toeic-part-num{font-family:var(--font-heading);font-size:var(--text-lg);font-weight:400;color:var(--gold)}
.toeic-part-lbl{font-size:10px;color:var(--text-muted);margin-top:2px}
.toeic-part-cnt{font-size:11px;color:var(--stardust);margin-top:2px;font-weight:600}
/* journey */
.journey-hero{background:linear-gradient(160deg,color-mix(in srgb,var(--sparkle) 18%,transparent) 0%,var(--surface) 60%);border:1px solid var(--border);border-radius:24px;padding:var(--space-md);margin-bottom:12px;position:relative;overflow:hidden}
.journey-hero::before{content:'';position:absolute;top:-40px;left:-40px;width:180px;height:180px;background:radial-gradient(circle,color-mix(in srgb,var(--stardust) 14%,transparent),transparent 60%);pointer-events:none}
.journey-title{font-family:var(--font-heading);font-size:var(--text-base);font-weight:400;margin-bottom:2px;position:relative;z-index:1;letter-spacing:-.01em}
.journey-sub{font-size:10px;color:var(--stardust);letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.journey-desc{font-size:var(--text-xs);color:var(--text-muted);margin-bottom:var(--space-md);line-height:1.6;position:relative;z-index:1}
.journey-chapters{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.jc-item{display:flex;align-items:center;gap:var(--space-sm);background:color-mix(in srgb,var(--text-primary) 5%,transparent);border:1px solid var(--border);border-radius:18px;padding:12px;cursor:pointer;transition:all var(--duration-base)}
.jc-item:hover:not(.locked){border-color:var(--border-active);background:color-mix(in srgb,var(--text-primary) 8%,transparent)}
.jc-item.locked{opacity:.4;cursor:not-allowed}
.jc-item.cleared{border-color:var(--enchanted)}
.jc-num{width:36px;height:36px;border-radius:50%;background:var(--sparkle);color:var(--night);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--text-sm);flex-shrink:0}
.jc-item.cleared .jc-num{background:var(--enchanted)}
.jc-item.locked .jc-num{background:var(--surface);color:var(--text-muted)}
.jc-body{flex:1;min-width:0}
.jc-name{font-weight:700;font-size:var(--text-sm);line-height:1.3}
.jc-sub{font-size:var(--text-xs);color:var(--text-muted);margin-top:2px}
.jc-arrow{color:var(--text-muted);flex-shrink:0}
/* instant composition */
.ic-hero{background:linear-gradient(160deg,color-mix(in srgb,var(--enchanted) 15%,transparent) 0%,var(--surface) 60%);border:1px solid color-mix(in srgb,var(--enchanted) 35%,transparent);border-radius:24px;padding:var(--space-md);margin-bottom:12px;position:relative;overflow:hidden}
.ic-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,color-mix(in srgb,var(--enchanted) 15%,transparent),transparent 60%);pointer-events:none}
.ic-badge{display:inline-block;background:var(--enchanted);color:var(--night);font-weight:800;font-size:10px;padding:3px 10px;border-radius:999px;letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.ic-title{font-family:var(--font-heading);font-weight:400;font-size:var(--text-base);margin-bottom:4px;letter-spacing:-.01em}
.ic-jp{font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:400;text-align:center;padding:var(--space-lg) var(--space-md);background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:var(--space-md);line-height:1.5;color:var(--text-primary)}
.ic-timer{position:absolute;top:12px;right:14px;font-size:var(--text-sm);font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.ic-input{width:100%;min-height:100px;padding:var(--space-md);background:var(--surface);border:1px solid var(--border);border-radius:18px;color:var(--text-primary);font-size:var(--text-base);font-family:inherit;resize:vertical;outline:none;line-height:1.6;margin-bottom:var(--space-sm)}
.ic-input:focus{border-color:var(--enchanted);box-shadow:0 0 0 3px color-mix(in srgb,var(--enchanted) 15%,transparent)}
.ic-actions{display:flex;gap:8px;margin-bottom:var(--space-md)}
.ic-actions .btn{flex:1}
.ic-reveal{background:var(--surface);border-left:2px solid var(--enchanted);border-radius:0 16px 16px 0;padding:var(--space-md);margin-bottom:var(--space-sm)}
.ic-reveal-en{font-size:var(--text-lg);font-weight:600;line-height:1.5;margin-bottom:6px}
.ic-reveal-pron{font-size:var(--text-sm);color:var(--text-muted);font-style:italic}
.ic-alt{font-size:var(--text-xs);color:var(--text-secondary);margin-top:var(--space-sm);line-height:1.7}
.ic-alt strong{color:var(--stardust);font-weight:600}
.ic-self-eval{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:var(--space-md)}
.ic-self-eval button{padding:12px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);font-size:var(--text-xs);font-weight:700;cursor:pointer;font-family:inherit;transition:all var(--duration-base)}
.ic-self-eval button:hover{border-color:var(--border-active)}
.ic-self-eval button.ok{border-color:var(--enchanted);color:var(--enchanted)}
.ic-self-eval button.mid{border-color:var(--gold);color:var(--gold)}
.ic-self-eval button.ng{border-color:var(--ember);color:var(--ember)}
.ic-progress{font-size:var(--text-xs);color:var(--text-muted);text-align:center;margin-bottom:var(--space-md)}
/* WDW special */
.wdw-hero{background:linear-gradient(135deg,#272e1b 0%,#3d472b 50%,#56633f 100%);border:1px solid rgba(245,200,76,.4);border-radius:26px;padding:var(--space-lg) var(--space-md);margin-bottom:12px;position:relative;overflow:hidden;color:#fff}
.wdw-hero::before{content:'';position:absolute;top:-20px;right:20px;width:200px;height:200px;background:radial-gradient(circle,rgba(245,200,76,.25),transparent 60%);pointer-events:none;animation:wdwPulse 4s ease-in-out infinite}
@keyframes wdwPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.wdw-castle{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);opacity:.35;pointer-events:none}
.wdw-castle svg{width:280px;height:auto}
.wdw-badge{display:inline-block;background:var(--gold);color:var(--night);font-weight:800;font-size:10px;padding:3px 10px;border-radius:999px;letter-spacing:.1em;margin-bottom:10px;text-transform:uppercase;position:relative;z-index:1}
.wdw-title{font-family:var(--font-heading);font-size:var(--text-xl);font-weight:400;letter-spacing:-.01em;margin-bottom:6px;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.wdw-title span{color:var(--gold)}
.wdw-count{font-family:var(--font-heading);font-size:var(--text-3xl);font-weight:400;color:var(--gold);letter-spacing:-.02em;line-height:1;margin:8px 0;position:relative;z-index:1;text-shadow:0 2px 12px color-mix(in srgb,var(--gold) 40%,transparent)}
.wdw-count-lbl{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.15em;text-transform:uppercase;font-weight:700;margin-bottom:var(--space-md);position:relative;z-index:1}
.wdw-desc{font-size:var(--text-xs);color:rgba(255,255,255,.85);line-height:1.6;margin-bottom:var(--space-md);position:relative;z-index:1}
.wdw-cta{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--night);padding:10px 18px;border-radius:999px;font-weight:800;font-size:var(--text-sm);text-decoration:none;box-shadow:0 4px 14px color-mix(in srgb,var(--gold) 35%,transparent)}
/* WDW category cards */
.wdw-cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wdw-cat{padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:20px;cursor:pointer;position:relative;transition:all var(--duration-base);min-height:90px}
.wdw-cat:hover{border-color:var(--border-active);background:var(--surface-hover)}
.wdw-cat-icon{width:32px;height:32px;border-radius:12px;background:linear-gradient(135deg,var(--sparkle),var(--gold));color:var(--night);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.wdw-cat-name{font-weight:700;font-size:var(--text-sm);letter-spacing:-.01em;line-height:1.2}
.wdw-cat-ja{font-size:11px;color:var(--text-muted);margin-top:2px}
.wdw-cat-cnt{font-size:10px;color:var(--stardust);font-weight:700;margin-top:4px}
.wdw-cat.done{border-color:var(--enchanted)}
.wdw-cat.done::after{content:'✓';position:absolute;top:8px;right:10px;color:var(--enchanted);font-weight:800;font-size:16px}
.cheat-cat{margin-bottom:18px}
.cheat-cat-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--text-sm);color:var(--sparkle);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.cheat-row{padding:7px 0;border-bottom:1px dashed var(--border)}
.cheat-row:last-child{border-bottom:none}
.cheat-en{font-size:var(--text-sm);font-weight:600;line-height:1.4}
.cheat-pron{font-size:10px;color:var(--stardust);margin-top:1px}
.cheat-ja{font-size:11px;color:var(--text-muted);margin-top:1px}
/* 聞き流しオーディオプレーヤー */
.audio-card{background:linear-gradient(160deg,#402310,#2a180c);border:1px solid var(--border-active);border-radius:24px;padding:36px 24px;text-align:center;margin-bottom:24px;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;overflow:hidden}
.audio-card::before{content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);width:200%;height:100%;background:radial-gradient(ellipse at 50% 0%,rgba(245,200,76,.14),transparent 60%);pointer-events:none}
.audio-idx{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.12em;position:relative}
.audio-en{font-size:var(--text-xl);font-weight:700;line-height:1.45;color:#fff;position:relative}
.audio-ja{font-size:var(--text-sm);color:rgba(255,255,255,.72);position:relative}
.audio-eq{display:flex;gap:4px;justify-content:center;height:18px;align-items:flex-end;position:relative;margin-top:-4px}
.audio-eq span{width:4px;background:var(--gold);border-radius:2px;animation:audeq 1s ease-in-out infinite}
.audio-eq.paused span{animation-play-state:paused;height:5px!important}
.audio-eq span:nth-child(1){animation-delay:0s}.audio-eq span:nth-child(2){animation-delay:.15s}.audio-eq span:nth-child(3){animation-delay:.3s}.audio-eq span:nth-child(4){animation-delay:.45s}
@keyframes audeq{0%,100%{height:5px}50%{height:18px}}
.audio-ctrl{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:6px}
.audio-ctrl .icon-btn{width:54px;height:54px}
.audio-playbtn{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--sparkle),var(--gold));border:none;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 20px rgba(198,113,57,.42);flex-shrink:0}
/* vocab card */
.vocab-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:var(--space-lg);margin-bottom:12px;text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;perspective:1000px}
.vocab-word{font-family:var(--font-heading);font-size:var(--text-3xl);font-weight:400;letter-spacing:-.01em;margin-bottom:8px}
.vocab-pos{display:inline-block;background:var(--sparkle);color:var(--night);font-size:10px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase}
.vocab-pron{font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-md);font-style:italic}
.vocab-hint{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-md)}
.vocab-ja{font-size:var(--text-lg);font-weight:600;color:var(--text-primary);margin-bottom:8px}
.vocab-ex{font-size:var(--text-sm);color:var(--text-secondary);line-height:1.6;padding:12px;background:var(--surface-hover);border-radius:14px;text-align:left;margin-top:var(--space-sm)}
.vocab-ex-ja{font-size:var(--text-xs);color:var(--text-muted);margin-top:4px}
.vocab-freq{position:absolute;top:12px;right:12px;font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.05em}
/* 単語帳（現物のフラッシュカード風） */
.wnote-wrap{position:relative;margin:20px 0 16px;padding-top:6px}
.wnote-peek{position:absolute;left:10px;right:10px;top:10px;bottom:-4px;background:#EFE3C8;border:1px solid rgba(32,30,29,.12);border-radius:20px;z-index:0}
.wnote-peek.p1{transform:rotate(-2.5deg)}
.wnote-peek.p2{transform:rotate(2.5deg);background:#E7D8B8}
.wnote-flip{position:relative;z-index:1}
.wnote-flip .rv-face{background:#FBF3E2;border:1px solid rgba(32,30,29,.14);padding-left:42px;box-shadow:2px 3px 0 rgba(32,30,29,.05)}
.wnote-flip .rv-back{background:#F5EAD3}
.wnote-flip .rv-face::after{content:'';position:absolute;left:38px;top:10px;bottom:10px;width:1px;background:rgba(196,64,58,.3)}
.wnote-rings{position:absolute;left:14px;top:18px;bottom:18px;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.wnote-rings i{display:block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),transparent 60%),rgba(32,30,29,.16);box-shadow:inset 0 1px 2px rgba(32,30,29,.35)}
.wnote-tag{position:absolute;top:12px;right:16px;font-size:10px;font-weight:700;color:#8c491a;letter-spacing:.06em;background:rgba(140,73,26,.1);padding:3px 9px;border-radius:999px}
.wnote-word{font-family:'Permanent Marker',cursive;font-size:2rem;color:#2b2620;text-align:center;letter-spacing:.01em;line-height:1.2;transform:rotate(-1deg);margin:10px 0 6px}
.wnote-pos{display:inline-block;background:#8c491a;color:#FBF3E2;font-size:10px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
@media (prefers-color-scheme: dark){
  .wnote-peek{background:#3a3226;border-color:rgba(249,244,237,.1)}
  .wnote-peek.p2{background:#332c22}
  .wnote-flip .rv-face{background:#463c2c;color:#F5EAD3}
  .wnote-flip .rv-back{background:#3d3527}
  .wnote-word{color:#F5EAD3}
}
/* plan */
.plan-card{background:linear-gradient(160deg,color-mix(in srgb,var(--sparkle) 14%,transparent),var(--surface) 65%);border:1px solid var(--border);border-radius:24px;padding:var(--space-md);margin-bottom:12px}
.plan-day{font-size:var(--text-xs);color:var(--stardust);font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.plan-title{font-family:var(--font-heading);font-weight:400;font-size:var(--text-base);margin-bottom:8px;letter-spacing:-.01em}
.plan-tasks{display:flex;flex-direction:column;gap:6px}
.plan-task{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:all var(--duration-base)}
.plan-task:hover{border-color:var(--border-active)}
.plan-task.done{border-color:var(--enchanted);background:color-mix(in srgb,var(--enchanted) 6%,transparent)}
.plan-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--enchanted)}
.plan-task.done .plan-check{border-color:var(--enchanted);background:var(--enchanted);color:var(--night)}
.plan-body{flex:1;min-width:0}
.plan-body-title{font-weight:600;font-size:var(--text-sm)}
.plan-body-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
.plan-mins{font-size:11px;color:var(--gold);font-weight:700}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ember) 40%,transparent)}50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--ember) 0%,transparent)}}

/* onboarding */
#onboarding{
  --night:#221a14;--gold:#f2b37b;--sparkle:#e08a4f;--sparkle-2:#f0a06b;--stardust:#a8be86;--enchanted:#a8be86;--ember:#e2884d;
  --text-primary:#f7efe2;--text-secondary:rgba(247,239,226,.72);--text-muted:rgba(247,239,226,.55);
  --border:rgba(247,239,226,.14);
  position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 30%,#8c491a 0%,#402310 55%,#221a14 100%);display:flex;flex-direction:column;text-align:center;overflow:hidden;color:var(--text-primary)
}
.ob-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ob-stars .st{position:absolute;background:#fff;border-radius:50%;animation:sttw var(--d,2.5s) var(--dl,0s) ease-in-out infinite}
@keyframes sttw{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.9;transform:scale(1.4)}}
/* full-bleed photo hero — covers the entire onboarding screen, text overlaid on top.
   The source photo is landscape (1152x740) but the screen is a tall portrait box, so a
   plain object-fit:cover would crop away most of the width. Instead we layer a blurred
   cover copy behind (fills every edge) and the full, uncropped photo on top via
   object-fit:contain (object-position pushed up so it isn't hidden behind the text). */
.ob-photo-hero{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;z-index:0}
.ob-photo-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:20% 18%;display:block;
  filter:saturate(.48) sepia(.46) hue-rotate(-12deg) contrast(1.15) brightness(.55) blur(28px);
  transform:scale(1.15);
}
.ob-photo-img{position:relative;width:100%;height:100%;object-fit:contain;object-position:50% 18%;display:block;
  filter:saturate(.48) sepia(.46) hue-rotate(-12deg) contrast(1.12) brightness(.9);
}
.ob-photo-hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(34,26,20,.12) 0%,rgba(34,26,20,.14) 30%,rgba(34,26,20,.42) 55%,rgba(34,26,20,.82) 75%,#221a14 92%),
    radial-gradient(130% 90% at 15% 10%,rgba(140,73,26,.3),transparent 55%);
  mix-blend-mode:multiply;
}
.ob-globe-wrap{position:relative;width:180px;height:180px;margin:0 auto}
#ob-globe-fallback.ob-globe-wrap{position:absolute;inset:0;width:auto;height:auto;display:flex;align-items:center;justify-content:center;margin:0}
#ob-globe-fallback .ob-globe-wrap-inner{width:180px;height:180px;position:relative}
.ob-globe{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#d67f48 0%,#8c491a 40%,#402310 100%);position:relative;box-shadow:0 0 60px rgba(198,113,57,.4),inset -12px -12px 30px rgba(0,0,0,.4)}
.ob-globe::before{content:'';position:absolute;top:10%;left:15%;width:22%;height:15%;background:rgba(255,230,200,.65);border-radius:40%;filter:blur(3px)}
.ob-globe::after{content:'';position:absolute;top:45%;left:55%;width:26%;height:20%;background:rgba(122,138,94,.45);border-radius:50%;filter:blur(3px)}
.ob-orbit{position:absolute;inset:-15px;border-radius:50%;border:1px dashed rgba(255,230,200,.35);animation:orbSpin 24s linear infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
.ob-plane{position:absolute;top:-8px;left:50%;transform:translateX(-50%);color:var(--gold)}
.ob-skip{position:absolute;top:calc(var(--space-md) + env(safe-area-inset-top,0px));right:var(--space-md);background:none;border:none;color:var(--text-muted);font-size:var(--text-sm);font-weight:600;z-index:10}
#ob-body{display:flex;flex-direction:column;width:100%;flex:1;position:relative;z-index:1}
.spark-avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--sparkle),var(--gold));display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-lg);color:var(--night)}
.tagline{font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:400;letter-spacing:-.01em;margin-bottom:var(--space-sm);line-height:1.3;position:relative;z-index:2;text-shadow:0 2px 16px rgba(20,14,8,.5)}
.ob-kicker{font-size:var(--text-xs);color:var(--gold);letter-spacing:.28em;text-transform:uppercase;font-weight:700;margin-bottom:var(--space-sm);position:relative;z-index:2;text-shadow:0 1px 8px rgba(20,14,8,.5)}
.ob-sub{color:var(--text-secondary);font-size:var(--text-sm);margin-bottom:var(--space-2xl);position:relative;z-index:2;line-height:1.6;max-width:340px}
.ob-field{width:100%;max-width:320px;text-align:left;margin-bottom:var(--space-md);position:relative;z-index:2}
.ob-field label{display:block;font-size:var(--text-xs);font-weight:600;color:var(--text-muted);margin-bottom:var(--space-xs)}
.ob-field input,.ob-field select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:16px;padding:12px 16px;color:var(--text-primary);font-size:var(--text-base);min-height:48px;color-scheme:dark;font-family:inherit}
.ob-field input:focus,.ob-field select:focus{outline:2px solid var(--sparkle);outline-offset:1px;border-color:transparent}
.ob-dots{display:flex;gap:6px;justify-content:center;margin-top:var(--space-lg);margin-bottom:var(--space-md);position:relative;z-index:2}
.ob-dots .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:all var(--duration-base)}
.ob-dots .dot.on{background:var(--gold);width:20px;border-radius:3px}
.ob-cta{position:relative;z-index:2}
.ob-target{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;max-width:320px;margin-bottom:var(--space-md)}
.ob-target button{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:16px;padding:12px 4px;color:var(--text-primary);font-weight:700;cursor:pointer;transition:all var(--duration-base);font-family:inherit}
.ob-target button.on{background:var(--gold);color:var(--night);border-color:var(--gold)}
.ob-target-sub{font-size:9px;font-weight:500;color:var(--text-muted);margin-top:2px}
.ob-target button.on .ob-target-sub{color:color-mix(in srgb,var(--night) 70%,transparent)}

/* misc */
.xp-popup{position:fixed;top:40%;left:50%;transform:translateX(-50%);z-index:90;background:var(--gold);color:var(--night);font-weight:700;font-size:var(--text-base);padding:10px 22px;border-radius:999px;pointer-events:none;opacity:0}
#confetti{position:fixed;inset:0;z-index:95;pointer-events:none;display:none}
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:var(--space-md)}
.modal{background:var(--night);border:1px solid var(--border);border-radius:24px;padding:var(--space-lg);width:100%;max-width:360px}
.empty{text-align:center;color:var(--text-muted);font-size:var(--text-sm);padding:var(--space-2xl) var(--space-md);line-height:1.7}
.back-row{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-md)}
.back-row h2{font-family:var(--font-heading);font-size:var(--text-xl);font-weight:400;flex:1}
.result-card{text-align:center;padding:var(--space-xl) var(--space-md)}
.result-score{font-family:var(--font-heading);font-size:var(--text-3xl);font-weight:400;margin:var(--space-sm) 0}
.result-msg{color:var(--text-secondary);font-size:var(--text-sm);line-height:1.6;margin-bottom:var(--space-lg)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<body>

<script>
'use strict';

      {id:'q_air_02',ctx:"入国審査官に渡航目的を聞かれました。",q:"何と答えますか？",choices:["I'm here for tourism.","I go to Disney.","Tourist.","For fun."],correct:0,exp:"「I'm here for tourism.」が自然な答え方。または「Tourism.」の一言でも通じます。",toeic:"TOEIC Part 3で目的を答える表現は必出。「I'm here for ~」の形を覚えておくこと。"},
      {id:'q_air_03',ctx:"荷物がベルトコンベアに出てきません。",q:"スタッフに何と言いますか？",choices:["I think my luggage is missing.","No bag come.","Where my bag?","Lost luggage problem."],correct:0,exp:"「I think my luggage is missing.」が適切。「I think」をつけることで穏やかな印象になります。",toeic:"TOEICのPart 4でアナウンスされる手荷物関連フレーズと関連します。"},
      {id:'q_air_04',ctx:"窓側の席を希望しています。",q:"チェックインスタッフに何と言いますか？",choices:["Could I have a window seat, if available?","Window seat want.","I like window.","Give window please."],correct:0,exp:"「Could I have a window seat, if available?」が丁寧で自然な表現です。",toeic:"「if available」はTOEICのビジネスメールにも頻出の丁寧表現。"},
      {id:'q_air_05',ctx:"乗り継ぎを逃してしまいました。",q:"何と伝えますか？",choices:["I missed my connection. What are my options?","I miss plane.","Next flight please.","Connection lost."],correct:0,exp:"「I missed my connection.」が正しい表現。「options」で選択肢を聞けます。",toeic:"「miss a connection」はTOEIC Part 3の頻出表現。"},
      {id:'q_air_06',ctx:"荷物の重量制限を確認したいです。",q:"何と聞きますか？",choices:["What's the baggage allowance?","How heavy bag OK?","Bag weight limit?","Max weight please?"],correct:0,exp:"「What's the baggage allowance?」が正しい表現。allowance = 許容量。",toeic:"「allowance」はTOEIC必須語彙。手当という意味でも頻出。"},
      {id:'q_air_07',ctx:"通路側の席を希望したいです。",q:"何と言いますか？",choices:["I'd prefer an aisle seat, if possible.","Aisle seat want.","Give me aisle.","I like aisle side."],correct:0,exp:"「I'd prefer ~, if possible.」が丁寧な希望の伝え方。",toeic:"「prefer」はTOEICのビジネスメールでも頻出の丁寧表現。"},
      {id:'q_air_08',ctx:"機内持ち込みが可能か確認したいです。",q:"何と聞きますか？",choices:["Can I carry this on board?","This bring plane OK?","Carry on possible?","Bag inside plane?"],correct:0,exp:"「Can I carry this on board?」が正しい表現。「on board」= 機内に。",toeic:"「on board」はTOEICの旅行・出張シーンで頻出。"},
      {id:'q_air_09',ctx:"搭乗時刻を確認したいです。",q:"何と聞きますか？",choices:["What time does boarding start?","When plane go?","Boarding when?","Time to fly?"],correct:0,exp:"「What time does boarding start?」が自然な表現。boarding = 搭乗。",toeic:"「boarding」はTOEIC Part 4のアナウンスで最頻出語の一つ。"},
      {id:'q_air_10',ctx:"税関申告について確認したいです。",q:"何と聞きますか？",choices:["Do I need to declare anything?","Customs say what?","Declare bag?","Tax paper need?"],correct:0,exp:"「Do I need to declare anything?」が正しい表現。declare = 申告する。",toeic:"「declare」はTOEIC Part 7の税関関連文書で出題される。"}
    ]
  },

        {who:'user',choices:[

        {who:'user',choices:[

      {id:'conv_order',title:'Table Service',titleJa:'レストランでの注文',character:'server',diff:1,estMin:5,turns:[

        {who:'user',choices:[

        {who:'char',en:"Perfect! Are you ready to order, or do you need a few more minutes?",ja:"かしこまりました。ご注文はお決まりですか、もう少し時間が必要ですか？"},
        {who:'user',choices:[
          {en:"We're ready! I'll have the grilled salmon, and she'll have the Caesar salad. Does the salmon contain any shellfish?",ja:"決まりました。私はグリルサーモン、彼女はシーザーサラダをお願いします。サーモンに貝類は含まれていますか？",q:'perfect',fb:"注文とアレルギー確認を同時にこなせました。レストランでの会話として完璧です。"},
          {en:"I'll have the salmon please.",ja:"サーモンをください。",q:'ok',fb:"通じます。アレルギーがある場合は「I'm allergic to ~」と伝えることを忘れずに。"},

        {who:'char',en:"The salmon is shellfish-free. Excellent choices! Anything else I can get you?",ja:"サーモンには貝類は含まれていません。素晴らしいご注文です！他に何かご入り用はございますか？"},
        {who:'user',choices:[
          {en:"We're good for now, thank you! Could we also get some extra napkins?",ja:"今のところ大丈夫です、ありがとう！追加のナプキンをもらえますか？",q:'perfect',fb:"「We're good for now」は「今のところ大丈夫」という便利表現。追加リクエストもスムーズに伝えられました。"},

        {who:'user',choices:[

    conversations:[
      {id:'conv_attraction',title:'Navigating the Park',titleJa:'パーク内での会話',character:'cast_member',diff:1,estMin:5,turns:[
        {who:'char',en:"Welcome! Great day to be in the park! How can I help you?",ja:"ようこそ！今日は最高のパーク日和ですね！何かお手伝いできますか？"},
        {who:'user',choices:[
          {en:"Hi! How long is the wait for this ride right now?",ja:"こんにちは！今このアトラクションの待ち時間はどのくらいですか？",q:'perfect',fb:"自然な会話の始め方です。挨拶から入るのがポイント。"},
          {en:"Wait time?",ja:"待ち時間は？",q:'ok',fb:"通じますが、「Hi! How long is the wait for this ride?」と言えると格段に自然です。"},
          {en:"How long ride?",ja:"乗り物はどのくらい？",q:'ng',fb:"「How long is the wait for this ride?」と聞きましょう。"}
        ]},
        {who:'char',en:"Right now it's about 45 minutes from this point. But there's a single rider line that's only about 15 minutes!",ja:"今このポイントから約45分です。でもシングルライダーレーンだと約15分ですよ！"},
        {who:'user',choices:[
          {en:"Oh great! Where is the single rider line? Also, is there a Lightning Lane option for this ride?",ja:"それはいいですね！シングルライダーレーンはどこですか？あとLightning Laneオプションはありますか？",q:'perfect',fb:"2つの質問を自然につなげられました。実際の会話でもこのパターンが効果的です。"},
          {en:"Where is single rider?",ja:"シングルライダーはどこ？",q:'ok',fb:"通じます。「Where is the single rider line?」と言えるとより自然です。"},
          {en:"OK single rider go.",ja:"シングルライダーに行きます。",q:'ng',fb:"「Where is the single rider line?」と場所を確認してから動きましょう。"}
        ]},
        {who:'char',en:"Single rider is right around that corner. And yes, Lightning Lane is available — you can book it on the app!",ja:"シングルライダーはそこの角を曲がったところです。Lightning Laneはアプリから予約できますよ！"},
        {who:'user',choices:[
          {en:"Perfect, thank you! One more thing — what time is the evening parade?",ja:"ありがとうございます！もう一つ聞いてもいいですか、イブニングパレードは何時ですか？",q:'perfect',fb:"「One more thing」は追加質問の自然な切り出し方。積極的に使いましょう。"},
          {en:"Thanks! What time is parade?",ja:"ありがとう！パレードは何時？",q:'ok',fb:"通じます。「What time is the evening parade?」と言えるとより自然です。"},
          {en:"When parade?",ja:"パレードはいつ？",q:'ng',fb:"「What time is the parade?」と聞きましょう。"}
        ]}
      ]},
      {id:'conv_photo',title:'Rain Plan & Photos',titleJa:'雨の日プランと写真',character:'cast_member',diff:2,estMin:5,turns:[
        {who:'char',en:"Hi there! Looks like some rain might be coming later. Is there anything I can help with?",ja:"こんにちは！後で雨が降るかもしれませんね。何かお手伝いできますか？"},
        {who:'user',choices:[
          {en:"Actually yes — what do most people do here when it starts raining?",ja:"実はそうなんです。雨が降り始めたら皆さんどうしていますか？",q:'perfect',fb:"状況を踏まえた自然な質問です。cast memberとのちょっとした会話にも使える表現です。"},
          {en:"What to do when rain?",ja:"雨の時どうする？",q:'ok',fb:"通じます。「What should we do if it rains?」と言えるとより自然です。"},
          {en:"Rain. What do?",ja:"雨。何する？",q:'ng',fb:"「What do people usually do when it rains?」と文で聞きましょう。"}
        ]},
        {who:'char',en:"Most indoor attractions and shops stay open, so it's a great time to explore those! Would you like a map of covered areas?",ja:"屋内のアトラクションやお店はほとんど営業を続けますので、そちらを回るのがおすすめです！屋根のあるエリアの地図が必要ですか？"},
        {who:'user',choices:[
          {en:"Yes, that would be great, thank you! Also, where's the nearest PhotoPass location?",ja:"はい、ぜひお願いします！あと、一番近いPhotoPassの場所はどこですか？",q:'perfect',fb:"地図のお願いと追加質問を自然につなげました。2つの用件を1つの会話で済ませる良い例です。"},
          {en:"Yes please. And PhotoPass?",ja:"はい、お願いします。あとPhotoPassは？",q:'ok',fb:"通じます。「Where's the nearest PhotoPass location?」と文で言えるとより自然です。"},
          {en:"Map. Photo where?",ja:"地図。写真どこ？",q:'ng',fb:"「Could I get a map? And where's the nearest PhotoPass location?」と丁寧に聞きましょう。"}
        ]},
        {who:'char',en:"There's one just past the fountain over there. They can also send photos straight to your phone!",ja:"あの噴水の先にありますよ。写真をスマホに直接送ることもできます！"},
        {who:'user',choices:[
          {en:"That's so convenient, thank you for all your help today!",ja:"それはとても便利ですね、今日はいろいろ助けていただきありがとうございました！",q:'perfect',fb:"感想と感謝を自然に伝えられました。cast memberとの会話を気持ちよく締めくくれています。"},
          {en:"Great, thanks a lot!",ja:"いいですね、どうもありがとう！",q:'ok',fb:"シンプルでOK。「Thank you for all your help.」を添えるとより丁寧です。"},
          {en:"OK good.",ja:"はい、いいですね。",q:'ng',fb:"「Thank you so much for your help!」のように感謝を伝えて締めましょう。"}
        ]}
      ]}

      {id:'q_tp_03',ctx:"子供の身長がアトラクションの制限を満たすか確認したいです。",q:"何と聞きますか？",choices:["Is there a height requirement for this ride?","How tall must child be?","Height limit?","Minimum height?"],correct:0,exp:"「Is there a height requirement?」が自然な質問です。requirementはTOEIC頻出語。",toeic:"「requirement」はTOEIC必須語彙。条件・要件という意味。"},
      {id:'q_tp_04',ctx:"アトラクションにバッグを忘れてきました。",q:"スタッフに何と言いますか？",choices:["I left my bag on the ride.","My bag is lost.","Bag on ride.","Forgot my bag."],correct:0,exp:"「I left my bag on the ride.」が正しい表現。left はleaveの過去形。",toeic:"TOEICのPart 3で忘れ物に関する会話が出題されます。"},

      {id:'q_tp_06',ctx:"パークの開園時間を確認したいです。",q:"何と聞きますか？",choices:["What time does the park open?","Park open when?","Time park start?","When begin park?"],correct:0,exp:"「What time does the park open?」が正しい語順。疑問文の基本形。",toeic:"TOEIC Part 1・4でアナウンス・案内の表現が出題されます。"},
      {id:'q_tp_07',ctx:"Lightning Laneが使えるか確認したいです。",q:"何と聞きますか？",choices:["Is there a Lightning Lane option for this ride?","Fast line have?","Lightning here?","Skip line yes?"],correct:0,exp:"「Is there a ~ option for this?」が丁寧な確認の定型表現。",toeic:"「option」はTOEICのビジネス文書で頻出の重要語彙。"},
      {id:'q_tp_08',ctx:"イブニングパレードの時間を知りたいです。",q:"何と聞きますか？",choices:["What time is the evening parade?","Parade when night?","Night show time?","Parade start what?"],correct:0,exp:"「What time is the evening parade?」が自然な表現。",toeic:"TOEIC Part 4でイベントスケジュールのアナウンスが出題されます。"},
      {id:'q_tp_09',ctx:"シングルライダーレーンの場所を聞きたいです。",q:"何と言いますか？",choices:["Where is the single rider line?","Single rider where?","Fast alone line?","One person line?"],correct:0,exp:"「Where is the single rider line?」が正しい表現。",toeic:"場所を尋ねる「Where is ~?」はTOEIC全パートで頻出。"},
      {id:'q_tp_10',ctx:"屋内で雨宿りできる場所を聞きたいです。",q:"何と言いますか？",choices:["What do people usually do when it rains?","Rain, what do?","Indoor place where?","No rain place?"],correct:0,exp:"「What do people usually do when ~?」で一般的な対処法を尋ねられる。",toeic:"「usually」はTOEIC頻出の頻度副詞。文中での位置にも注意。"}

// Combined vocab list — tier assigned to each word
const TOEIC_VOCAB=[...TOEIC_VOCAB_T1.map(v=>({...v,tier:1})),...TOEIC_VOCAB_T2.map(v=>({...v,tier:2})),...TOEIC_VOCAB_T3.map(v=>({...v,tier:3})),...TOEIC_VOCAB_T4.map(v=>({...v,tier:4}))];
function tierMastered(t){return TOEIC_VOCAB.filter(v=>v.tier===t).filter(v=>{const r=PROG.phrases[v.id];return r&&r.correct>=1}).length}
function tierTotal(t){return TOEIC_VOCAB.filter(v=>v.tier===t).length}
function activeTier(){
  // Unlock next tier when current is 80% mastered
  for(const t of TIERS){
    const total=tierTotal(t.id);
    if(!total)continue;
    const done=tierMastered(t.id);
    if(done/total<0.8)return t;
  }
  return TIERS[TIERS.length-1];
}

        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${esc(t.desc)}</div>
        ${!locked?`<div style="height:4px;background:var(--surface-hover);border-radius:999px;margin-top:6px;overflow:hidden"><div style="height:100%;background:${t.color};width:${pct}%;transition:width var(--duration-slow) var(--ease-out)"></div></div>`:''}

  }).join('')}</div>`;

let vocabState=null;
function vocabDueList(){
  const t=todayStr();const active=activeTier().id;
  const dueSame=[],dueOther=[],unseenSame=[],unseenOther=[],rest=[];
  TOEIC_VOCAB.forEach(v=>{
    const r=PROG.phrases[v.id];
    const inTier=v.tier===active;
    if(!r||!r.views){(inTier?unseenSame:unseenOther).push(v)}
    else if(r.nextReview<=t){(inTier?dueSame:dueOther).push(v)}
    else rest.push(v);
  });
  // Prioritize: due-in-active-tier > unseen-in-active-tier > due-other > unseen-other > rest
  return [...dueSame,...unseenSame,...dueOther,...unseenOther,...rest].slice(0,10);
}
function vocabMastered(){return TOEIC_VOCAB.filter(v=>{const r=PROG.phrases[v.id];return r&&r.correct>=1}).length}
function openVocab(){

/* ========== 6-MONTH TOEIC PLAN ========== */
function planStartDate(){
  let s=PROG.planStart;
  if(!s){s=todayStr();PROG.planStart=s;commit()}
  return s;
}
function planDayNum(){
  const s=new Date(planStartDate()),n=new Date();
  return Math.max(1,Math.floor((n-s)/86400000)+1);
}
function planPhase(day){
  if(day<=30)return{n:1,name:'Foundation',ja:'基礎固め',desc:'語彙とPart 5文法を反射的に。'};
  if(day<=90)return{n:2,name:'Build',ja:'実力構築',desc:'リスニングと読解を鍛える。'};
  if(day<=150)return{n:3,name:'Simulate',ja:'実戦強化',desc:'模試ペースで全パート横断。'};
  return{n:4,name:'Polish',ja:'仕上げ',desc:'弱点の穴埋めと復習。'};
}
function planTasksForToday(){
  const day=planDayNum();const ph=planPhase(day);
  // Base plan; vary lightly by phase
  const base=[
    {id:'p_vocab',title:'TOEIC核心語彙 10語',sub:activeTier().name+'・SRSで自動選出',mins:5,action:'vocab'},
    {id:'p_p5',title:'Part 5 文法 5問',sub:'短文穴埋め',mins:4,action:'p5'},
    {id:'p_ic',title:'瞬間英作文 5問',sub:'日→英を即興',mins:4,action:'ic'},
  ];
  if(ph.n>=2)base.push({id:'p_p3',title:'Part 3 会話練習 1本',sub:'今日のシナリオ',mins:5,action:'story'});
  if(ph.n>=3)base.push({id:'p_p7',title:'Part 7 読解 3問',sub:'速読トレーニング',mins:6,action:'p7'});
  const doneKey='plan_'+todayStr();
  const done=(PROG[doneKey]||[]);
  return base.map(t=>({...t,done:done.includes(t.id)}));
}
function markPlanTaskDone(id){
  const doneKey='plan_'+todayStr();
  PROG[doneKey]=PROG[doneKey]||[];
  if(!PROG[doneKey].includes(id)){
    PROG[doneKey].push(id);commit();sfx('correct');
    const tasks=planTasksForToday();
    if(tasks.every(t=>t.done)&&!inDaySession())setTimeout(openDailyChest,700);
  }
}

}

const LOGIN_REWARDS=[10,15,20,25,30,40,60]; // Day7はさらにストリーク保護+1
function claimLoginBonus(){
  const t=todayStr();
  PROG.loginCycle=PROG.loginCycle||{day:0,lastDate:''};
  const lc=PROG.loginCycle;
  if(lc.lastDate===t)return null;
  lc.day=(lc.lastDate&&Math.round((new Date(t)-new Date(lc.lastDate))/86400000)===1)?(lc.day%7)+1:1;
  lc.lastDate=t;
  const xp=LOGIN_REWARDS[lc.day-1];
  PROG.xp=(PROG.xp||0)+xp;
  PROG.xpDaily=PROG.xpDaily||{};PROG.xpDaily[t]=(PROG.xpDaily[t]||0)+xp;
  let freeze=false;
  if(lc.day===7){PROG.streakFreezes=(PROG.streakFreezes||0)+1;freeze=true}
  commit();
  return{day:lc.day,xp,freeze};
}

  return `<div class="login-strip">${LOGIN_REWARDS.map((r,i)=>{

  PROG.lastChestDate=t;
  const bonus=100;

  PROG.xpDaily=PROG.xpDaily||{};PROG.xpDaily[t]=(PROG.xpDaily[t]||0)+bonus;
  const gotFreeze=Math.random()<0.3;
  if(gotFreeze)PROG.streakFreezes=(PROG.streakFreezes||0)+1;
  commit();checkWeeklyGoal();
  launchConfetti();sfx('unlock');
  // 明日の予告（ツァイガルニク効果：続きが気になる状態で終える）
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  const nextCity=CITY_ROTATION[tomorrow.getDay()];
  const m=document.createElement('div');m.className='modal-back';m.id='chest-modal';
  m.innerHTML=`<div class="modal" style="text-align:center">
    ${sparkHeroHTML('win')}
    <div style="font-size:var(--text-xl);font-weight:800;margin:8px 0 4px">今日のプラン完了！</div>
    <div style="font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:14px">宝箱を獲得しました</div>
    <div style="display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">

      ${gotFreeze?`<div style="background:rgba(31,181,133,.14);border:1px solid rgba(31,181,133,.35);border-radius:12px;padding:10px 16px;font-weight:800;color:var(--enchanted)">ストリーク保護 +1</div>`:''}
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:16px;text-align:left">
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.06em;margin-bottom:4px">明日の予告</div>
      <div style="font-size:var(--text-sm)">${esc(nextCity.en)}（${esc(nextCity.ja)}）の物語が待っています。連続 ${getStreak()+1} 日目を一緒に迎えよう。</div>
    </div>
    <button class="btn btn-gold btn-block" onclick="document.getElementById('chest-modal').remove()">また明日！</button>
  </div>`;
  document.body.appendChild(m);
  m.onclick=e=>{if(e.target===m)m.remove()};
  if(window.gsap&&!PREF_REDUCED)gsap.fromTo(m.querySelector('.modal'),{scale:.85,opacity:0},{scale:1,opacity:1,duration:.4,ease:'back.out(1.6)'});
}
function planTaskAction(action){
  if(action==='vocab')return openVocab();
  if(action==='p5')return openTOEICPart(5);
  if(action==='p7')return openTOEICPart(7);
  if(action==='p3')return openTOEICPart(3);
  if(action==='ic')return openIC();
  if(action==='reduction')return openReduction();
  if(action==='review')return openReview();
  if(action==='story'){const c=todaysCity();const list=CITY_STORIES[c.key]||[];if(list.length)return openStory(c.key,list[0].id);return showToast('ストーリーがありません')}
}
function todayFocusHTML(){
  const h=new Date().getHours();
  const greet=h<5?'こんばんは':h<11?'おはよう':h<18?'こんにちは':'こんばんは';
  const tasks=planTasksForToday();
  const next=tasks.find(t=>!t.done);
  const done=tasks.filter(t=>t.done).length;
  const totalMin=tasks.reduce((n,t)=>n+t.mins,0);
  const pct=Math.round(done/Math.max(1,tasks.length)*100);
  const due=totalDue();
  const allDone=!next;
  let cta;
  if(allDone){
    cta=due>0
      ?`<button class="btn btn-gold btn-block" id="focus-start" data-action="review">復習 ${due}件に挑戦 ${ICONS.arrowRight}</button>`
      :`<button class="btn btn-secondary btn-block" id="focus-start" data-action="vocab">もう少し続ける ${ICONS.arrowRight}</button>`;
  }else{
    cta=`<div class="focus-next"><div class="focus-next-txt"><div class="focus-next-title">まずは：${esc(next.title)}</div><div class="focus-next-sub">全${tasks.length}ステップ・約${totalMin}分を続けて</div></div><div class="focus-mins">${totalMin}分</div></div>
    <button class="btn btn-gold btn-block" id="focus-start" data-session="1">今日のトレーニングを始める ${ICONS.arrowRight}</button>`;
  }
  const weak=(typeof weaknessReport==='function'?weaknessReport():[])[0];
  const weakHTML=weak?`<div class="focus-weak" id="focus-weak-nudge" role="button" tabindex="0"><span>${ICONS.zap}</span><span class="focus-weak-txt">今の弱点：<b>${esc(weak.label)}</b>（正答率${Math.round(weak.acc*100)}%）</span><span>${ICONS.arrowRight}</span></div>`:'';
  return `<div class="focus-card glow-card">
    <div class="focus-head">
      <div><div class="focus-greet">${greet}</div><div class="focus-sub">${allDone?'今日のプラン完了！お見事です':'今日のプラン '+done+'/'+tasks.length+' 完了 · 約'+totalMin+'分'}</div></div>
      <div class="focus-ring" style="--p:${pct}"><span>${pct}<small>%</small></span></div>
    </div>
    ${weakHTML}
    ${cta}
    ${loginStripHTML()}
    <div class="focus-chips">
      <button class="focus-chip" data-fa="vocab">${ICONS.star}<span>単語</span></button>
      <button class="focus-chip" data-fa="p5">${ICONS.award}<span>文法</span></button>
      <button class="focus-chip" data-fa="reduction">${ICONS.play}<span>音声変化</span></button>
      <button class="focus-chip" data-fa="mock">${ICONS.clock}<span>模試</span></button>
    </div>
  </div>`;
}
function focusChipAction(a){
  if(a==='vocab')return openVocab();
  if(a==='p5')return openTOEICPart(5);
  if(a==='reduction')return openReduction();
  if(a==='mock')return startMock();
}
function bindFocusWeakNudge(){
  const el=document.getElementById('focus-weak-nudge');
  if(!el)return;
  const row=weaknessReport()[0];if(!row)return;
  el.onclick=()=>row.action();
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.action()}};
}

const WDW_DEFAULT_TRIP_DATE='2026-11-30'; // ユーザーの実際の目標日
function wdwDaysLeft(){
  const tv=loadTravel();
  const date=tv.date||WDW_DEFAULT_TRIP_DATE;
  return Math.ceil((new Date(date)-new Date())/86400000);
}
function wdwTotalPhrases(){return Object.values(WDW_PHRASES).reduce((n,arr)=>n+arr.length,0)}
function wdwCatMastered(catId){return (WDW_PHRASES[catId]||[]).filter(p=>{const r=PROG.phrases[p.id];return r&&r.correct>=1}).length}
function wdwMastered(){return WDW_CATS.reduce((n,c)=>n+wdwCatMastered(c.id),0)}

let tipState={bill:'',pct:20,split:1};
function openTipCalc(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-review');el.classList.add('active');
  window.scrollTo(0,0);
  const pcts=[15,18,20,25];
  el.innerHTML=`
    <div class="back-row"><button class="icon-btn" onclick="go('wdw')" aria-label="戻る">${ICONS.arrowLeft}</button><h2>チップ計算機</h2></div>
    <div class="card">

      <input id="tip-bill" type="number" inputmode="decimal" placeholder="0.00" value="${tipState.bill}" style="width:100%;font-size:var(--text-2xl);font-weight:800;padding:10px 12px;margin-top:6px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text-primary)">
